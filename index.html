<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMI · Control de Maquinaria y Equipos · Casalimpia S.A.</title>
  
  <!-- Fuentes e Iconos Corporativos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- ApexCharts CDN para Gráficos Interactivos -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

  <script>
    // Portal 100% independiente: lee la hoja de cálculo directo, sin backend intermedio.
    const SHEET_ID = "1YNdMgaPXapO-b7OGYNNVcZb34suJzoYM1Y8liSa8bmY";
    const NOMBRE_HOJA = "Hoja 1";
    // Único uso de Apps Script: guardar/leer la bitácora de comentarios y notas de voz por pedido.
    // ⚠️ Debe apuntar a tu Codigo.gs desplegado como Web App (/exec).
    const COMENTARIOS_API_URL = "https://script.google.com/macros/s/AKfycbz8Y1pFuPL4z5kM3L96ohYUX34FigXZB2vmb2mctoVGszM3sjLHcByILNJUt_-YiDvh/exec";
  </script>

  <style>
    :root {
      --cl-verde: #7ab833;
      --cl-verde-hover: #69a727;
      --cl-verde-light: #f1f8e9;
      --cl-azul: #0082c8;
      --cl-azul-hover: #006eb3;
      --cl-azul-dark: #0a3356;
      --cl-azul-light: #e0f2fe;
      --bg-main: #f8fafc;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --verde-ok: #22c55e;
      --amarillo-warn: #eab308;
      --rojo-crit: #ef4444;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(122, 184, 51, 0.12), transparent 60%),
        radial-gradient(1000px 500px at 10% 0%, rgba(0, 130, 200, 0.12), transparent 50%),
        linear-gradient(180deg, var(--cl-azul-dark) 0%, #0f172a 240px, #f8fafc 240px, #f8fafc 100%);
      background-size: 100% 100%, 100% 100%, 100% 100%;
      min-height: 100vh;
      animation: bgDrift 18s ease-in-out infinite alternate;
    }

    @keyframes bgDrift {
      0% { background-position: 0% 0%, 0% 0%, 0% 0%; }
      100% { background-position: 4% 3%, -3% -2%, 0% 0%; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(.94) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    @keyframes floatGlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes countTick {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
      body { animation: none; }
    }

    /* Mientras el video de intro está activo, se congelan las animaciones ambientales
       (no el video) para no competir por el hilo principal / compositor del navegador. */
    body.intro-activa *:not(.intro-overlay):not(.intro-overlay *) { animation-play-state: paused !important; }

    .wrap { max-width: 1750px; margin: 0 auto; padding: 20px 24px 60px; position: relative; z-index: 1; }

    /* Header Corporativo Casalimpia */
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 28px;
      border-radius: 24px; background: rgba(10, 51, 86, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      backdrop-filter: blur(12px); position: relative; z-index: 10; color: #fff;
      animation: fadeInUp .6s var(--ease) both; overflow: hidden;
    }
    header::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(100deg, transparent 30%, rgba(122,184,51,0.18) 48%, transparent 66%);
      background-size: 220% 100%; animation: headerSweep 7s linear infinite;
    }
    @keyframes headerSweep {
      0% { background-position: 120% 0; }
      100% { background-position: -120% 0; }
    }
    .brand { display: flex; align-items: center; gap: 18px; }
    .logo-header-wrap {
      display: flex; align-items: center; justify-content: center;
      background: #ffffff; padding: 8px 16px; border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .header-logo { height: 42px; width: auto; object-fit: contain; display: block; }
    .titulos h1 { margin: 0; font-weight: 800; font-size: 20px; color: #ffffff; letter-spacing: -0.3px; }
    .titulos p { margin: 4px 0 0; font-size: 13px; color: #93c5fd; }

    .head-right { display: flex; align-items: center; gap: 18px; }
    .clock { text-align: right; color: #93c5fd; font-size: 12px; display: flex; flex-direction: column; align-items: flex-end; }
    .clock b { color: #ffffff; font-family: 'IBM Plex Mono'; font-size: 13px; }
    .pulse-live {
      width: 8px; height: 8px; border-radius: 50%; background: var(--cl-verde);
      display: inline-block; margin-right: 6px; box-shadow: 0 0 10px var(--cl-verde);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.5; } }

    .btn-refresh {
      appearance: none; border: 0; cursor: pointer; border-radius: 12px; padding: 10px 16px;
      font-weight: 700; font-size: 13px; background: var(--cl-verde); color: #ffffff;
      display: inline-flex; align-items: center; gap: 8px; transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .2s;
      box-shadow: 0 4px 14px rgba(122, 184, 51, 0.4);
    }
    .btn-refresh:hover { background: var(--cl-verde-hover); transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 22px rgba(122, 184, 51, 0.5); }
    .btn-refresh:active { transform: translateY(0) scale(.97); }
    .btn-refresh.spinning span.ico { display: inline-block; animation: spinIco .7s linear; }
    @keyframes spinIco { to { transform: rotate(360deg); } }

    /* Filtros Glassmorphism Avanzados */
    .controls-glass {
      display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-top: 18px;
      padding: 18px 22px; background: rgba(255, 255, 255, 0.95); border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); border: 1px solid var(--line);
      backdrop-filter: blur(16px); position: relative; z-index: 500;
      animation: fadeInUp .6s var(--ease) .08s both;
    }
    .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 145px; position: relative; }
    .field.search-field { flex: 2; min-width: 210px; }
    .field label { font-size: 11px; font-weight: 800; color: var(--cl-azul-dark); text-transform: uppercase; letter-spacing: 0.5px; }

    .date-input, .field input[type="text"] {
      width: 100%; height: 40px; border: 1px solid var(--line); background: #f8fafc; border-radius: 12px;
      padding: 0 12px; font-family: inherit; font-size: 13px; color: var(--ink); outline: none; transition: .15s;
    }
    .date-input, .field input[type="text"], .combo-input { transition: border-color .18s, box-shadow .18s, background .18s; }
    .date-input:focus, .field input[type="text"]:focus { border-color: var(--cl-azul); background: #ffffff; box-shadow: 0 0 0 3px rgba(0, 130, 200, 0.15); }

    .combo-wrap { position: relative; width: 100%; z-index: 501; }
    .combo-input {
      width: 100%; height: 40px; border: 1px solid var(--line); background: #f8fafc; border-radius: 12px;
      padding: 0 28px 0 12px; font-family: inherit; font-size: 12.5px; color: var(--ink);
      cursor: pointer; text-overflow: ellipsis; outline: none; font-weight: 600;
    }
    .combo-arrow { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); pointer-events: none; }
    .combo-panel {
      position: absolute; left: 0; right: 0; top: 46px; background: #ffffff; border: 1px solid var(--line);
      border-radius: 16px; box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25); z-index: 9999 !important; display: none; padding: 10px; min-width: 250px;
      opacity: 0; transform: translateY(-6px) scale(.98); transition: opacity .16s var(--ease), transform .16s var(--ease);
    }
    .combo-panel.show { display: block; opacity: 1; transform: translateY(0) scale(1); }
    .combo-item-multi { transition: background .15s, color .15s; }
    .combo-search { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; margin-bottom: 8px; outline: none; background: #f8fafc; }
    .combo-actions { display: flex; gap: 6px; margin-bottom: 8px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
    .combo-actions button { flex: 1; border: none; background: #f1f5f9; color: var(--ink); font-size: 11px; font-weight: 700; padding: 5px; border-radius: 6px; cursor: pointer; }
    .combo-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
    .combo-item-multi { display: flex; align-items: center; gap: 10px; padding: 7px 10px; font-size: 12.5px; border-radius: 8px; cursor: pointer; }
    .combo-item-multi:hover { background: var(--cl-verde-light); color: var(--cl-verde-hover); }

    .btn-clear {
      border: 1px solid var(--line); background: #f1f5f9; color: var(--ink); font-size: 12.5px; font-weight: 700;
      padding: 8px 14px; border-radius: 12px; cursor: pointer; height: 40px; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-clear:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }

    .controls-glass .sep { flex: 1; }
    .chip-group { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .vista-chip { font-size: 13px; font-weight: 800; color: var(--cl-azul); background: var(--cl-azul-light); border: 1px solid #bae6fd; padding: 6px 14px; border-radius: 999px; }
    .vista-subchip { font-size: 11.5px; color: var(--muted); font-weight: 600; }

    /* Dock de Módulos (estilo macOS, horizontal, en el flujo entre filtros e indicadores) */
    .dock-wrap {
      position: relative; margin-top: 18px; z-index: 60;
      animation: fadeInUp .6s var(--ease) .14s both;
    }
    .dock-bar {
      display: flex; flex-direction: row; align-items: flex-end; justify-content: space-between; gap: 12px;
      padding: 12px 22px 56px; width: 100%; overflow: visible;
      border-radius: 26px; background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 16px 34px rgba(15, 23, 42, 0.14), 0 0 0 1px rgba(15,23,42,0.03);
    }
    .dock-item {
      position: relative; width: 50px; height: 50px; min-height: 50px; border-radius: 16px; border: none;
      background: #eef2f7; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 22px; line-height: 1; color: var(--ink);
      transition: width .16s cubic-bezier(.34,1.56,.64,1), height .16s cubic-bezier(.34,1.56,.64,1),
                  transform .16s cubic-bezier(.34,1.56,.64,1), background .2s, font-size .16s cubic-bezier(.34,1.56,.64,1);
    }
    .dock-item:hover, .dock-item:focus-visible { background: #e2e8f0; outline: none; }
    .dock-item.active { background: var(--cl-azul-dark); box-shadow: 0 8px 18px rgba(10,51,86,0.35); }
    .dock-item.active::after {
      content: ''; position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
      width: 5px; height: 5px; border-radius: 50%; background: var(--cl-verde); box-shadow: 0 0 6px var(--cl-verde);
    }
    .dock-label {
      position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%) translateY(-4px);
      background: var(--cl-azul-dark); color: #fff; font-size: 11.5px; font-weight: 700; letter-spacing: .2px;
      padding: 5px 12px; border-radius: 9px; white-space: nowrap; opacity: 0; pointer-events: none;
      transition: opacity .15s var(--ease), transform .15s var(--ease); box-shadow: 0 6px 14px rgba(0,0,0,0.2);
    }
    .dock-item:hover .dock-label, .dock-item:focus-visible .dock-label, .dock-item.active .dock-label {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }
    .dock-item.active .dock-label { background: var(--cl-verde); color: #0a3356; }

    .hint-bar { display: flex; justify-content: space-between; align-items: center; margin: 14px 4px 6px; font-size: 12px; color: #64748b; font-weight: 500; }

    /* Grid de Métricas */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 12px; align-items: start; }
    .col { display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: #ffffff; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
      border: 1px solid var(--line); transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s;
      position: relative; overflow: hidden; opacity: 0; animation: fadeInUp .55s var(--ease) forwards;
      animation-delay: calc(var(--card-i, 0) * 70ms);
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; transform: scaleX(0); transform-origin: left;
      background: linear-gradient(90deg, var(--cl-verde), var(--cl-azul)); transition: transform .35s var(--ease); z-index: 2;
    }
    .card::after {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
      background: linear-gradient(100deg, transparent 30%, rgba(122,184,51,0.10) 48%, rgba(0,130,200,0.08) 58%, transparent 70%);
      background-size: 220% 100%; animation: headerSweep 8s linear infinite;
      animation-delay: calc(var(--card-i, 0) * -420ms);
    }
    .card > * { position: relative; z-index: 2; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 24px 40px -12px rgba(15, 23, 42, 0.16); border-color: rgba(0,130,200,0.25); }
    .card:hover::before { transform: scaleX(1); }
    .card.clickable:active { transform: translateY(-1px) scale(.99); }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-title { font-weight: 800; font-size: 14px; color: var(--cl-azul-dark); }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.verde { background: var(--cl-verde); box-shadow: 0 0 0 3px rgba(122,184,51,0.2); animation: dotPulse 2.4s infinite; }
    .dot.amarillo { background: var(--amarillo-warn); box-shadow: 0 0 0 3px rgba(234,179,8,0.2); animation: dotPulse 2.4s infinite; }
    .dot.rojo { background: var(--rojo-crit); box-shadow: 0 0 0 3px rgba(239,68,68,0.2); animation: dotPulse 1.4s infinite; }
    .dot.neu { background: var(--cl-azul); box-shadow: 0 0 0 3px rgba(0,130,200,0.2); }
    @keyframes dotPulse { 0%, 100% { box-shadow: 0 0 0 3px rgba(0,0,0,0.08); } 50% { box-shadow: 0 0 0 6px rgba(0,0,0,0.03); } }

    .card-body { margin-top: 12px; display: flex; align-items: baseline; gap: 8px; }
    .big { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 40px; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; }
    .u { font-size: 14px; color: var(--muted); font-weight: 700; }
    .card-foot { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); }

    .chart-container { margin-top: 10px; min-height: 250px; opacity: 0; animation: fadeIn .5s var(--ease) .15s forwards; }
    .clickable { cursor: pointer; }

    /* Modal Consolidado */
    .modal {
      position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center;
      background: rgba(10, 51, 86, 0.7); backdrop-filter: blur(8px); padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity .25s var(--ease);
    }
    .modal.show { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: #f8fafc; border-radius: 24px; max-width: 1150px; width: 100%; max-height: 88vh; display: flex; flex-direction: column;
      overflow: hidden; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
      transform: scale(.93) translateY(16px); transition: transform .3s var(--ease);
    }
    .modal.show .modal-card { transform: scale(1) translateY(0); }
    .modal-head { padding: 20px 28px; background: var(--cl-azul-dark); display: flex; justify-content: space-between; align-items: center; color: #fff; }
    .modal-head h3 { margin: 0; font-size: 16.5px; font-weight: 800; color: #ffffff; }
    .btn-close { border: none; background: rgba(255,255,255,0.15); border-radius: 50%; width: 36px; height: 36px; font-size: 20px; cursor: pointer; color: #fff; display: grid; place-items: center; }
    .btn-close:hover { background: var(--rojo-crit); }
    .modal-body { padding: 20px; overflow-y: auto; max-height: 75vh; }

    .consolidado-container { display: flex; flex-direction: column; gap: 14px; }
    .pedido-card { background: #ffffff; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03); overflow: hidden; }
    .pedido-head { background: #f1f5f9; padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .badge-pedido { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 13px; color: var(--cl-azul); background: var(--cl-azul-light); padding: 4px 10px; border-radius: 8px; }
    .pedido-cliente { font-weight: 800; font-size: 13.5px; color: var(--cl-azul-dark); }
    .badge-count { background: var(--cl-verde-light); color: var(--cl-verde-hover); font-weight: 800; padding: 4px 10px; border-radius: 20px; font-size: 11.5px; }

    .pedido-body { padding: 12px 18px; display: flex; flex-direction: column; gap: 8px; }
    .item-row { display: grid; grid-template-columns: 2fr 1.2fr 0.8fr 2fr; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: #fafafa; border: 1px solid #f1f5f9; font-size: 12.5px; }
    .code-activo { font-family: 'IBM Plex Mono'; font-weight: 600; color: var(--cl-azul); background: var(--cl-azul-light); padding: 2px 7px; border-radius: 6px; font-size: 11px; }
    .badge-accion { background: #f3f4f6; color: #374151; font-weight: 700; padding: 3px 8px; border-radius: 6px; font-size: 11px; }
    .tag-dias { font-family: 'IBM Plex Mono'; font-weight: 700; padding: 4px 10px; border-radius: 20px; font-size: 11px; text-align: center; }
    .tag-dias.ok { background: #dcfce7; color: #15803d; } .tag-dias.warn { background: #fef3c7; color: #b45309; } .tag-dias.crit { background: #fee2e2; color: #b91c1c; }

    /* Bitácora de Seguimiento (texto + nota de voz real) */
    .comments-section { margin-top: 14px; padding: 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; }
    .comments-title { font-size: 12.5px; font-weight: 800; color: var(--cl-azul-dark); margin-bottom: 8px; }
    .voice-input-wrap { display: flex; gap: 10px; margin-bottom: 10px; }
    .comment-textarea { flex: 1; height: 54px; border: 1px solid #cbd5e1; border-radius: 10px; padding: 8px 12px; font-family: inherit; font-size: 12px; outline: none; resize: none; background: #ffffff; }

    .btn-record {
      appearance: none; border: none; background: var(--cl-azul); color: #ffffff; font-weight: 800; font-size: 12px;
      padding: 0 16px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: background .2s, transform .2s var(--ease); white-space: nowrap; height: 54px;
    }
    .btn-record:hover { background: var(--cl-azul-hover); }
    .btn-record.recording { background: var(--rojo-crit) !important; animation: pulse 1.2s infinite; }

    .audio-preview { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
    .audio-preview audio { height: 34px; max-width: 260px; }
    .btn-clear-audio { border: none; background: #fee2e2; color: #b91c1c; font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 8px; cursor: pointer; }

    .btn-save-comment { border: none; background: var(--cl-verde); color: #ffffff; font-weight: 700; font-size: 12px; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .btn-save-comment:hover { background: var(--cl-verde-hover); }

    .comments-history { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; }
    .comment-item { background: #ffffff; border: 1px solid var(--line); padding: 10px 12px; border-radius: 10px; font-size: 12px; }
    .comment-item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .comment-user { font-weight: 700; color: var(--cl-azul-dark); }
    .comment-date { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono'; }
    .comment-audio { display: block; height: 34px; width: 100%; max-width: 320px; margin-top: 6px; }
    .comment-actions { display: flex; gap: 8px; margin-top: 6px; }
    .btn-action-comm { border: none; background: none; font-size: 11px; font-weight: 700; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
    .btn-action-comm.edit { color: var(--cl-azul); } .btn-action-comm.del { color: var(--rojo-crit); }

    .vacio { padding: 60px; text-align: center; color: var(--muted); font-size: 14px; font-weight: 600; }

    #loader {
      position: fixed; inset: 0; background: rgba(10, 51, 86, 0.55); backdrop-filter: blur(4px); display: flex;
      align-items: center; justify-content: center; z-index: 20000; opacity: 0; pointer-events: none; transition: opacity .2s var(--ease);
    }
    #loader.show { opacity: 1; pointer-events: auto; }
    .spin-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: floatGlow 2.2s ease-in-out infinite; }
    .spin { width: 54px; height: 54px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.18); border-top-color: var(--cl-verde); border-right-color: var(--cl-azul); animation: sp .9s cubic-bezier(.5,0,.5,1) infinite; }
    .spin-label { color: #e2f2ff; font-size: 12px; font-weight: 700; letter-spacing: .4px; }
    @keyframes sp { to { transform: rotate(360deg); } }

    @media (max-width: 1200px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } .item-row { grid-template-columns: 1fr; } }

    /* Video de introducción */
    .intro-overlay {
      position: fixed; inset: 0; z-index: 99999; background: #000109; display: flex;
      align-items: center; justify-content: center; opacity: 1; transition: opacity .45s var(--ease);
    }
    .intro-overlay.hide { opacity: 0; pointer-events: none; }
    .intro-video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .btn-skip-intro {
      position: absolute; bottom: 32px; right: 32px; z-index: 2; appearance: none; border: 1px solid rgba(255,255,255,0.35);
      cursor: pointer; border-radius: 999px; padding: 11px 22px; font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700; font-size: 13.5px; background: rgba(255,255,255,0.12); color: #ffffff; backdrop-filter: blur(8px);
      display: inline-flex; align-items: center; gap: 8px; transition: background .2s, transform .2s var(--ease), border-color .2s;
    }
    .btn-skip-intro:hover { background: var(--cl-verde); border-color: var(--cl-verde); transform: translateY(-2px); }
    .intro-logo {
      position: absolute; top: 28px; left: 32px; z-index: 2; display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.94); padding: 7px 14px; border-radius: 14px; box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    .intro-logo img { height: 30px; display: block; }
    @media (prefers-reduced-motion: reduce) { .intro-overlay { transition: none; } }
  </style>
</head>
<body>
  <div id="introOverlay" class="intro-overlay">
    <div class="intro-logo"><img src="https://lh3.googleusercontent.com/d/1Oad9PEeniRz-nGI6idxfZr7BCBJzKD8C" alt="Casalimpia"></div>
    <video id="introVideo" class="intro-video" autoplay playsinline>
      <source src="Video Introduccion.mp4" type="video/mp4">
    </video>
    <button class="btn-skip-intro" id="btnSkipIntro" onclick="saltarIntro()">Saltar intro ⏭</button>
  </div>

  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo-header-wrap">
          <img src="https://lh3.googleusercontent.com/d/1Oad9PEeniRz-nGI6idxfZr7BCBJzKD8C" alt="Logo Casalimpia" class="header-logo">
        </div>
        <div class="titulos">
          <h1>CMI · CONTROL DE MAQUINARIA Y EQUIPOS</h1>
          <p>Panel Operativo de Mantenimiento y Logística · Casalimpia S.A.</p>
        </div>
      </div>
      <div class="head-right">
        <div class="clock">
          <span class="pulse-live"></span> Datos en vivo
          <b id="actualizado">—</b>
        </div>
        <button class="btn-refresh" id="btnRefresh" onclick="cargarDatos()"><span class="ico">🔄</span> Actualizar</button>
      </div>
    </header>

    <div class="controls-glass">
      <div class="field"><label>Periodo (Mes/Año)</label><div id="comboPeriodo"></div></div>
      <div class="field"><label>Fecha exacta (Día)</label><input type="date" id="inputFechaDia" class="date-input"></div>
      <div class="field"><label>Cliente</label><div id="comboCliente"></div></div>
      <div class="field"><label>Ciudad</label><div id="comboCiudad"></div></div>
      <div class="field"><label>Estado</label><div id="comboEstado"></div></div>
      <div class="field"><label>Estado Entrega</label><div id="comboEstadoEntrega"></div></div>
      <div class="field"><label>Acción</label><div id="comboAccion"></div></div>
      <div class="field search-field"><label>Búsqueda rápida</label><input type="text" id="inputBusqueda" placeholder="🔍 Pedido, Activo, Maquinaria..."></div>
      
      <button class="btn-clear" onclick="limpiarFiltros()">🧹 Limpiar</button>
      <div class="sep"></div>
      <div class="chip-group">
        <span class="vista-chip" id="chipPedidos">0 Pedidos Únicos</span>
        <span class="vista-subchip" id="chipItems">(0 ítems)</span>
      </div>
    </div>

    <div class="dock-wrap">
      <nav class="dock-bar" id="dockBar" role="toolbar" aria-label="Módulos del panel"></nav>
    </div>

    <div class="hint-bar">
      <span>✨ Clic en cualquier tarjeta o barra interactiva para explorar el desglose por pedido</span>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <div id="loader"><div class="spin-wrap"><div class="spin"></div><div class="spin-label">Sincronizando datos…</div></div></div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modalTitulo">Detalle Consolidado de Solicitudes</h3>
        <button class="btn-close" onclick="cerrarModal()">&times;</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
    let ESTADO = {
      periodoSel: [], fechaDiaSel: '', clienteSel: [], ciudadSel: [], estadoSel: [],
      estadoEntregaSel: [], accionSel: [], busqueda: '', moduloSel: 'general',
      eventos: [], filtros: {}, modulos: {}, actualizado: ''
    };
    let CHART_INSTANCES = {};

    const MODULOS = {
      general:       { label: 'Vista 360°',                 icono: '🧭', acciones: null },
      mantenimiento: { label: 'Mantenimiento Correctivo',    icono: '🛠️', acciones: ['MantenimientoCorrectivo', 'Mantenimiento Correctivo'] },
      entregas:      { label: 'Entregas / Iniciaciones',     icono: '📦', acciones: ['Iniciacion', 'Iniciación'] },
      recogidas:     { label: 'Recogidas y Cierres',         icono: '🚚', acciones: ['Recogida', 'TerminacionContrato', 'Terminación Contrato', 'Terminacion Contrato'] },
      accesorios:    { label: 'Accesorios y Adicionales',    icono: '🧩', acciones: ['CambioAccesorio', 'Cambio Accesorio', 'Adicional'] }
    };
    const PALABRAS_FALLA_CRITICA = ['EN CORTO', 'NO PRENDE', 'CORTOCIRCUITO', 'FALLA ESTRUCTURAL', 'NO ENCIENDE', 'NO FUNCIONA'];

    function normTexto(s) {
      if (!s) return '';
      return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('inputBusqueda').addEventListener('input', (e) => { ESTADO.busqueda = e.target.value; render(); });
      document.getElementById('inputFechaDia').addEventListener('change', (e) => { ESTADO.fechaDiaSel = e.target.value; render(); });
      document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') cerrarModal(); });
      inicializarIntro();
    });

    // El dashboard (fetch + render de gráficos) no arranca hasta que la intro
    // termina o se salta: hacerlo en paralelo con el video saturaba el hilo
    // principal del navegador y provocaba que el video se congelara.
    let DATOS_INICIADOS = false;

    function inicializarIntro() {
      const video = document.getElementById('introVideo');
      if (!video) { cargarDatos(); return; }
      document.body.classList.add('intro-activa');
      video.addEventListener('ended', saltarIntro);
      video.play().catch(() => {
        // Autoplay con sonido bloqueado por el navegador: reintenta silenciado.
        video.muted = true;
        video.play().catch(() => {});
      });
    }

    function saltarIntro() {
      document.body.classList.remove('intro-activa');
      const overlay = document.getElementById('introOverlay');
      if (overlay) {
        const video = document.getElementById('introVideo');
        overlay.classList.add('hide');
        if (video) video.pause();
        setTimeout(() => overlay.remove(), 500);
      }
      if (!DATOS_INICIADOS) { DATOS_INICIADOS = true; cargarDatos(); }
    }

    function loader(show) { document.getElementById('loader').classList.toggle('show', !!show); }

    async function cargarDatos() {
      const btn = document.getElementById('btnRefresh');
      if (btn) { btn.classList.add('spinning'); btn.disabled = true; }
      loader(true);
      try {
        const data = await obtenerDatosDesdeSheet();
        inicializar(data);
      } catch (e) {
        console.error("Error al cargar datos:", e);
        document.getElementById('grid').innerHTML = '<div class="vacio">No se pudo conectar con la hoja de cálculo. Verifica que esté compartida como "Cualquier persona con el enlace puede ver".</div>';
      }
      loader(false);
      if (btn) { btn.disabled = false; setTimeout(() => btn.classList.remove('spinning'), 700); }
    }

    /**
     * Carga el JSON de Google Visualization (gviz) vía JSONP (etiqueta <script>).
     * Abrir el portal como archivo local (file://) hace que un fetch() normal sea
     * bloqueado por CORS ("Access-Control-Allow-Origin: null" en la respuesta de
     * Google). Un <script src="..."> no pasa por CORS, así que este es el único
     * método que funciona tanto en file:// como en un servidor real.
     */
    function cargarJsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = 'gvizCallback_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
        const script = document.createElement('script');

        const limpiar = () => { delete window[callbackName]; script.remove(); };

        window[callbackName] = (json) => { limpiar(); resolve(json); };
        script.onerror = () => { limpiar(); reject(new Error('No se pudo cargar el script de Google Sheets.')); };

        script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'tqx=out:json;responseHandler:' + callbackName;
        document.body.appendChild(script);
      });
    }

    /**
     * Lee la hoja directamente desde el endpoint público de Google Visualization (gviz),
     * sin ningún backend intermedio. Mapea columnas por nombre de encabezado (no por
     * posición), así que es inmune a que se reordenen o inserten columnas en la hoja.
     */
    async function obtenerDatosDesdeSheet() {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(NOMBRE_HOJA)}&_=${Date.now()}`;
      const json = await cargarJsonp(url);
      const cols = (json.table && json.table.cols) || [];
      const filas = (json.table && json.table.rows) || [];

      const colIndex = {};
      cols.forEach((c, i) => { if (c.label) colIndex[normTexto(c.label)] = i; });

      function buscarCol(nombres) {
        for (const n of nombres) { const idx = colIndex[normTexto(n)]; if (idx !== undefined) return idx; }
        return -1;
      }

      const idx = {
        pedido:     buscarCol(['# Pedido', 'Pedido']),
        cliente:    buscarCol(['Cliente']),
        ciudad:     buscarCol(['Ciudad']),
        fechaSol:   buscarCol(['Fecha de solicitud']),
        diasProc:   buscarCol(['Dias En Proceso']),
        estado:     buscarCol(['Estado']),
        accion:     buscarCol(['Accion']),
        maquinaria: buscarCol(['Maquinaria']),
        codActivo:  buscarCol(['Cod. Activo', 'Placa']),
        obsDetalle: buscarCol(['Observacion Detalle']),
        estEntrega: buscarCol(['Estado de Entrega'])
      };

      function celda(fila, i) {
        return (i === -1 || !fila.c || !fila.c[i]) ? null : fila.c[i];
      }
      function txt(fila, i) {
        const c = celda(fila, i);
        if (!c) return '';
        const val = (c.f !== undefined && c.f !== null) ? c.f : c.v;
        return (val === undefined || val === null) ? '' : String(val).trim();
      }
      function num(fila, i) {
        const c = celda(fila, i);
        if (!c || c.v === null || c.v === undefined) return 0;
        const n = Number(c.v);
        return isNaN(n) ? 0 : n;
      }
      function fecha(fila, i) {
        const c = celda(fila, i);
        return (c && c.f) ? String(c.f).trim() : '';
      }

      function extraerPeriodo(fechaStr) {
        if (!fechaStr) return 'Sin fecha';
        const partes = fechaStr.split('/');
        if (partes.length === 3) return partes[2] + '-' + (partes[1].length < 2 ? '0' + partes[1] : partes[1]);
        return 'Sin fecha';
      }

      function esFallaCritica(detalle) {
        if (!detalle) return false;
        const d = detalle.toUpperCase();
        return PALABRAS_FALLA_CRITICA.some(p => d.indexOf(p) >= 0);
      }

      function moduloDeAccion(accion) {
        const normAcc = normTexto(accion);
        for (const clave of Object.keys(MODULOS)) {
          if (clave === 'general') continue;
          const m = MODULOS[clave];
          if (m.acciones && m.acciones.some(a => normTexto(a) === normAcc)) return clave;
        }
        return 'otros';
      }

      const eventos = [];
      filas.forEach(fila => {
        const pedido = txt(fila, idx.pedido);
        if (!pedido) return;

        const accion = txt(fila, idx.accion) || 'Sin acción';
        const obsDetalle = txt(fila, idx.obsDetalle);
        const fSolicitud = fecha(fila, idx.fechaSol);

        eventos.push({
          pedido: pedido,
          cliente: txt(fila, idx.cliente) || 'Sin cliente',
          ciudad: txt(fila, idx.ciudad) || 'Sin ciudad',
          fechaSolicitud: fSolicitud,
          periodo: extraerPeriodo(fSolicitud),
          diasProceso: num(fila, idx.diasProc),
          estado: txt(fila, idx.estado) || 'Sin estado',
          accion: accion,
          modulo: moduloDeAccion(accion),
          maquinaria: txt(fila, idx.maquinaria) || 'Sin especificar',
          codActivo: txt(fila, idx.codActivo),
          observacionDetalle: obsDetalle,
          esFallaCritica: esFallaCritica(obsDetalle),
          estadoEntrega: txt(fila, idx.estEntrega) || 'Sin estado entrega'
        });
      });

      function unicos(campo) {
        const vistos = {};
        eventos.forEach(e => { if (e[campo]) vistos[e[campo]] = true; });
        return Object.keys(vistos).sort((a, b) => a.localeCompare(b, 'es'));
      }

      const filtros = {
        clientes: unicos('cliente'),
        ciudades: unicos('ciudad'),
        acciones: unicos('accion'),
        estados: unicos('estado'),
        estadosEntrega: unicos('estadoEntrega'),
        periodos: unicos('periodo')
      };

      const actualizado = new Date().toLocaleString('es-CO', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit', hour12: true });

      return { eventos, filtros, modulos: MODULOS, actualizado };
    }

    function animarContadores(root) {
      const nodos = (root || document).querySelectorAll('.big[data-target]');
      nodos.forEach(el => {
        const target = parseFloat(el.dataset.target) || 0;
        const duracion = 700;
        const t0 = performance.now();
        const paso = (t) => {
          const p = Math.min(1, (t - t0) / duracion);
          const ease = 1 - Math.pow(1 - p, 3);
          el.textContent = Math.round(target * ease);
          if (p < 1) requestAnimationFrame(paso);
          else el.textContent = target;
        };
        requestAnimationFrame(paso);
      });
    }

    function inicializar(data) {
      ESTADO.eventos = data.eventos || [];
      ESTADO.filtros = data.filtros || {};
      ESTADO.modulos = data.modulos || {};
      ESTADO.actualizado = data.actualizado || '—';

      document.getElementById('actualizado').textContent = ESTADO.actualizado;
      construirDock();
      poblarCombos();
      render();
    }

    const DOCK_BASE = 50;
    const DOCK_MAX = 84;
    const DOCK_RANGE = 140;

    function construirDock() {
      const dock = document.getElementById('dockBar');
      if (!dock) return;
      dock.innerHTML = Object.keys(ESTADO.modulos).map(k => {
        const m = ESTADO.modulos[k];
        const active = (k === ESTADO.moduloSel) ? 'active' : '';
        return `<button class="dock-item ${active}" data-modulo="${k}" onclick="cambiarModulo('${k}')" aria-label="${m.label}">
          <span class="dock-label">${m.label}</span>
          <span aria-hidden="true">${m.icono}</span>
        </button>`;
      }).join('');
      inicializarMagnificacionDock(dock);
    }

    function inicializarMagnificacionDock(dock) {
      if (dock.dataset.magnifyBound) return;
      dock.dataset.magnifyBound = '1';

      const aplicar = (clientX) => {
        dock.querySelectorAll('.dock-item').forEach(item => {
          const rect = item.getBoundingClientRect();
          const centro = rect.left + rect.width / 2;
          const dist = clientX === null ? Infinity : Math.abs(clientX - centro);
          const factor = Math.max(0, 1 - dist / DOCK_RANGE);
          const size = DOCK_BASE + (DOCK_MAX - DOCK_BASE) * factor;
          item.style.width = size + 'px';
          item.style.height = size + 'px';
          item.style.fontSize = (22 + 18 * factor) + 'px';
          item.style.transform = `translateY(${-10 * factor}px)`;
        });
      };

      dock.addEventListener('mousemove', (e) => aplicar(e.clientX));
      dock.addEventListener('mouseleave', () => aplicar(null));
    }

    function cambiarModulo(key) {
      ESTADO.moduloSel = key;
      construirDock();
      render();
    }

    function crearComboMultiples(contenedorId, opciones, seleccionados, alCambiar, etiquetaTodos) {
      const container = document.getElementById(contenedorId);
      if (!container) return;
      const opcionesList = opciones || [];

      const obtenerTextoBoton = () => {
        if (!seleccionados || seleccionados.length === 0) return etiquetaTodos;
        if (seleccionados.length === 1) return seleccionados[0];
        return seleccionados.length + ' seleccionados';
      };

      container.innerHTML = `
        <div class="combo-wrap">
          <input type="text" class="combo-input" value="${obtenerTextoBoton()}" readonly>
          <span class="combo-arrow">▾</span>
          <div class="combo-panel">
            <input type="text" class="combo-search" placeholder="🔍 Buscar...">
            <div class="combo-actions">
              <button type="button" class="btn-all">Todos</button>
              <button type="button" class="btn-none">Limpiar</button>
            </div>
            <div class="combo-list"></div>
          </div>
        </div>
      `;

      const wrap = container.querySelector('.combo-wrap');
      const input = container.querySelector('.combo-input');
      const panel = container.querySelector('.combo-panel');
      const search = container.querySelector('.combo-search');
      const list = container.querySelector('.combo-list');

      const renderizarLista = (filtro) => {
        const filtrados = opcionesList.filter(it => !filtro || it.toLowerCase().indexOf(filtro.toLowerCase()) >= 0);
        if (!filtrados.length) { list.innerHTML = '<div style="padding:8px;font-size:11px;">Sin resultados</div>'; return; }
        list.innerHTML = filtrados.map(it => {
          const isChecked = seleccionados.indexOf(it) >= 0 ? 'checked' : '';
          return `<label class="combo-item-multi"><input type="checkbox" value="${it.replace(/"/g, '&quot;')}" ${isChecked}><span>${it}</span></label>`;
        }).join('');
      };

      input.addEventListener('click', () => {
        document.querySelectorAll('.combo-panel.show').forEach(p => { if(p !== panel) p.classList.remove('show'); });
        panel.classList.toggle('show');
        if (panel.classList.contains('show')) { search.value = ''; renderizarLista(''); search.focus(); }
      });

      search.addEventListener('input', () => renderizarLista(search.value));
      list.addEventListener('change', (e) => {
        if (e.target.tagName === 'INPUT') {
          const val = e.target.value;
          if (e.target.checked) { if (seleccionados.indexOf(val) < 0) seleccionados.push(val); }
          else { const idx = seleccionados.indexOf(val); if (idx >= 0) seleccionados.splice(idx, 1); }
          input.value = obtenerTextoBoton(); alCambiar(seleccionados);
        }
      });

      container.querySelector('.btn-all').addEventListener('click', () => {
        seleccionados.length = 0; opcionesList.forEach(it => seleccionados.push(it));
        renderizarLista(search.value); input.value = obtenerTextoBoton(); alCambiar(seleccionados);
      });
      container.querySelector('.btn-none').addEventListener('click', () => {
        seleccionados.length = 0; renderizarLista(search.value); input.value = obtenerTextoBoton(); alCambiar(seleccionados);
      });
      document.addEventListener('click', (e) => { if (!wrap.contains(e.target)) panel.classList.remove('show'); });
    }

    function poblarCombos() {
      crearComboMultiples('comboPeriodo', ESTADO.filtros.periodos, ESTADO.periodoSel, v => { ESTADO.periodoSel = v; render(); }, 'Todos los periodos');
      crearComboMultiples('comboCliente', ESTADO.filtros.clientes, ESTADO.clienteSel, v => { ESTADO.clienteSel = v; render(); }, 'Todos los clientes');
      crearComboMultiples('comboCiudad', ESTADO.filtros.ciudades, ESTADO.ciudadSel, v => { ESTADO.ciudadSel = v; render(); }, 'Todas las ciudades');
      crearComboMultiples('comboEstado', ESTADO.filtros.estados, ESTADO.estadoSel, v => { ESTADO.estadoSel = v; render(); }, 'Todos los estados');
      crearComboMultiples('comboEstadoEntrega', ESTADO.filtros.estadosEntrega, ESTADO.estadoEntregaSel, v => { ESTADO.estadoEntregaSel = v; render(); }, 'Todos los estados entrega');
      crearComboMultiples('comboAccion', ESTADO.filtros.acciones, ESTADO.accionSel, v => { ESTADO.accionSel = v; render(); }, 'Todas las acciones');
    }

    function limpiarFiltros() {
      ESTADO.periodoSel = []; ESTADO.fechaDiaSel = ''; ESTADO.clienteSel = []; ESTADO.ciudadSel = [];
      ESTADO.estadoSel = []; ESTADO.estadoEntregaSel = []; ESTADO.accionSel = []; ESTADO.busqueda = '';
      document.getElementById('inputFechaDia').value = '';
      document.getElementById('inputBusqueda').value = '';
      poblarCombos(); render();
    }

    function filtrarEventos() {
      return ESTADO.eventos.filter(e => {
        if (ESTADO.moduloSel !== 'general' && e.modulo !== ESTADO.moduloSel) return false;
        if (ESTADO.periodoSel.length > 0 && ESTADO.periodoSel.indexOf(e.periodo) < 0) return false;
        if (ESTADO.clienteSel.length > 0 && ESTADO.clienteSel.indexOf(e.cliente) < 0) return false;
        if (ESTADO.ciudadSel.length > 0 && ESTADO.ciudadSel.indexOf(e.ciudad) < 0) return false;
        if (ESTADO.estadoSel.length > 0 && ESTADO.estadoSel.indexOf(e.estado) < 0) return false;
        if (ESTADO.estadoEntregaSel.length > 0 && ESTADO.estadoEntregaSel.indexOf(e.estadoEntrega) < 0) return false;
        if (ESTADO.accionSel.length > 0 && ESTADO.accionSel.indexOf(e.accion) < 0) return false;
        if (ESTADO.busqueda) {
          const q = ESTADO.busqueda.toLowerCase();
          const txtMatch = (e.pedido + ' ' + e.codActivo + ' ' + e.maquinaria + ' ' + e.cliente + ' ' + e.observacionDetalle).toLowerCase();
          if (txtMatch.indexOf(q) < 0) return false;
        }
        return true;
      });
    }

    function contarPedidosUnicos(evs) {
      const vistos = {}; evs.forEach(e => { if (e.pedido) vistos[e.pedido] = true; });
      return Object.keys(vistos).length;
    }

    function render() {
      Object.keys(CHART_INSTANCES).forEach(k => { if (CHART_INSTANCES[k]) CHART_INSTANCES[k].destroy(); });
      CHART_INSTANCES = {};

      const evs = filtrarEventos();
      document.getElementById('chipPedidos').textContent = contarPedidosUnicos(evs) + ' Pedidos Únicos';
      document.getElementById('chipItems').textContent = '(' + evs.length + ' ítems)';

      const grid = document.getElementById('grid');
      if (!evs.length) { grid.innerHTML = '<div class="vacio">No hay solicitudes que coincidan.</div>'; return; }

      CARD_INDEX = 0;
      let html = '';
      if (ESTADO.moduloSel === 'general') html = renderVista360(evs);
      else if (ESTADO.moduloSel === 'mantenimiento') html = renderMantenimiento(evs);
      else if (ESTADO.moduloSel === 'entregas') html = renderEntregas(evs);
      else if (ESTADO.moduloSel === 'recogidas') html = renderRecogidas(evs);
      else if (ESTADO.moduloSel === 'accesorios') html = renderAccesorios(evs);

      grid.innerHTML = html;
      animarContadores(grid);
      setTimeout(() => renderizarGraficosApex(evs), 50);
    }

    function renderVista360(evs) {
      const promDias = evs.length ? Math.round(evs.reduce((a, b) => a + b.diasProceso, 0) / evs.length) : 0;
      const criticos = evs.filter(e => e.diasProceso >= 3);
      return `<div class="col">
        ${cardKPI('Total Pedidos Únicos', contarPedidosUnicos(evs), 'órdenes', 'verde', evs.length + ' ítems', 'general')}
        ${cardKPI('Promedio Días en Proceso', promDias, 'días', 'neu', 'Tiempo promedio acumulado', 'general')}
        ${cardKPI('Fuera de SLA (≥ 3 días)', contarPedidosUnicos(criticos), 'órdenes', criticos.length > 0 ? 'rojo' : 'verde', criticos.length + ' ítems retraso', 'sla')}
      </div>
      <div class="col">
        ${cardChartBox('Tendencia de Pedidos (Mes a Mes)', 'chartTendencia')}
        ${cardChartBox('Top Fallas Frecuentes', 'chartFallas')}
      </div>
      <div class="col">
        ${cardChartBox('Equipos Más Solicitados', 'chartEquipos')}
        ${cardChartBox('Top Clientes con Requerimientos', 'chartClientes')}
      </div>`;
    }

    function renderMantenimiento(evs) {
      const fallasCrit = evs.filter(e => e.esFallaCritica);
      return `<div class="col">
        ${cardKPI('Mantenimientos Correctivos', contarPedidosUnicos(evs), 'órdenes', 'neu', evs.length + ' averías', 'general')}
        ${cardKPI('Fallas Críticas ("En Corto")', contarPedidosUnicos(fallasCrit), 'órdenes', 'rojo', fallasCrit.length + ' casos', 'criticas')}
      </div>
      <div class="col">${cardChartBox('Principales Fallas Reportadas', 'chartFallas')}</div>
      <div class="col">${cardChartBox('Equipos con Mayor Tasa de Falla', 'chartEquipos')}</div>`;
    }

    function renderEntregas(evs) {
      return `<div class="col">${cardKPI('Solicitudes de Entrega', contarPedidosUnicos(evs), 'órdenes', 'verde', evs.length + ' asignados', 'general')}</div>
      <div class="col">${cardChartBox('Equipos Entregados por Tipo', 'chartEquipos')}</div>
      <div class="col">${cardChartBox('Destino por Cliente', 'chartClientes')}</div>`;
    }

    function renderRecogidas(evs) {
      return `<div class="col">${cardKPI('Recogidas y Terminaciones', contarPedidosUnicos(evs), 'órdenes', 'amarillo', evs.length + ' retiros', 'general')}</div>
      <div class="col">${cardChartBox('Motivo de Retiro', 'chartAcciones')}</div>
      <div class="col">${cardChartBox('Sedes en Recogida', 'chartClientes')}</div>`;
    }

    function renderAccesorios(evs) {
      return `<div class="col">${cardKPI('Requerimiento de Accesorios', contarPedidosUnicos(evs), 'órdenes', 'neu', evs.length + ' insumos', 'general')}</div>
      <div class="col">${cardChartBox('Accesorios Más Pedidos', 'chartEquipos')}</div>
      <div class="col">${cardChartBox('Consumo por Cliente', 'chartClientes')}</div>`;
    }

    let CARD_INDEX = 0;

    function cardKPI(titulo, valor, unidad, semaforo, sub, filtroTipo, valorFiltro) {
      const i = CARD_INDEX++;
      return `<div class="card clickable" style="--card-i:${i}" onclick="abrirDetalleKpi('${titulo}', '${filtroTipo}', '${valorFiltro || ''}')">
        <div class="card-top"><span class="card-title">${titulo}</span><span class="dot ${semaforo}"></span></div>
        <div class="card-body"><span class="big" data-target="${valor}">0</span><span class="u">${unidad}</span></div>
        <div class="card-foot">${sub}</div>
      </div>`;
    }

    function cardChartBox(titulo, chartId) {
      const i = CARD_INDEX++;
      return `<div class="card" style="--card-i:${i}"><div class="card-top"><span class="card-title">${titulo}</span></div><div id="${chartId}" class="chart-container"></div></div>`;
    }

    function agrupar(evs, campo, top) {
      const conteo = {}; evs.forEach(e => { const val = e[campo] || 'Sin especificar'; conteo[val] = (conteo[val] || 0) + 1; });
      return Object.keys(conteo).map(k => ({ label: k, val: conteo[k] })).sort((a,b) => b.val - a.val).slice(0, top || 6);
    }

    function renderizarGraficosApex(evs) {
      if (document.getElementById('chartTendencia')) renderTendenciaMensual('chartTendencia', evs);
      if (document.getElementById('chartFallas')) renderBarraHorizontal('chartFallas', agrupar(evs, 'observacionDetalle', 5), 'observacionDetalle', '#0082c8');
      if (document.getElementById('chartEquipos')) renderBarraHorizontal('chartEquipos', agrupar(evs, 'maquinaria', 5), 'maquinaria', '#7ab833');
      if (document.getElementById('chartClientes')) renderBarraHorizontal('chartClientes', agrupar(evs, 'cliente', 5), 'cliente', '#0a3356');
      if (document.getElementById('chartAcciones')) renderBarraHorizontal('chartAcciones', agrupar(evs, 'accion', 6), 'accion', '#eab308');
    }

    function agruparPorPeriodo(evs) {
      const conteo = {};
      const pedidosVistos = {};
      evs.forEach(e => {
        if (!e.periodo || e.periodo === 'Sin fecha') return;
        if (!pedidosVistos[e.periodo]) pedidosVistos[e.periodo] = {};
        if (e.pedido && !pedidosVistos[e.periodo][e.pedido]) {
          pedidosVistos[e.periodo][e.pedido] = true;
          conteo[e.periodo] = (conteo[e.periodo] || 0) + 1;
        }
      });
      return Object.keys(conteo).sort().map(p => ({ periodo: p, val: conteo[p] }));
    }

    function formatearPeriodo(periodo) {
      const NOMBRES_MES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      const partes = periodo.split('-');
      const idxMes = parseInt(partes[1], 10) - 1;
      return (NOMBRES_MES[idxMes] || partes[1]) + " '" + partes[0].slice(2);
    }

    function renderTendenciaMensual(elId, evs) {
      const container = document.getElementById(elId); if (!container) return;
      const datos = agruparPorPeriodo(evs);

      if (!datos.length) {
        container.innerHTML = '<div style="padding:70px 20px; text-align:center; color:var(--muted); font-size:12.5px;">Sin fechas suficientes en los filtros actuales para trazar la tendencia.</div>';
        return;
      }

      const options = {
        series: [{ name: 'Pedidos', data: datos.map(d => d.val) }],
        chart: {
          type: 'area', height: 250, fontFamily: "'Plus Jakarta Sans', sans-serif", toolbar: { show: false },
          animations: { enabled: true, easing: 'easeout', speed: 500 },
          dropShadow: { enabled: true, top: 3, blur: 5, color: '#0082c8', opacity: 0.18 }
        },
        stroke: { curve: 'smooth', width: 3 },
        colors: ['#0082c8'],
        fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.35, opacityTo: 0.03, stops: [0, 100] } },
        dataLabels: { enabled: false },
        grid: { borderColor: '#eef2f7', strokeDashArray: 4 },
        xaxis: { categories: datos.map(d => formatearPeriodo(d.periodo)), labels: { style: { colors: '#64748b', fontSize: '11px' } } },
        yaxis: { labels: { style: { colors: '#64748b', fontSize: '11px' } } },
        tooltip: { theme: 'dark', style: { fontFamily: "'Plus Jakarta Sans', sans-serif" }, y: { formatter: (v) => v + ' pedido(s)' } },
        markers: { size: 4, colors: ['#ffffff'], strokeColors: '#0082c8', strokeWidth: 2, hover: { size: 6 } }
      };
      CHART_INSTANCES[elId] = new ApexCharts(container, options);
      CHART_INSTANCES[elId].render();
    }

    function renderBarraHorizontal(elId, datos, campoFiltro, colorHex) {
      const container = document.getElementById(elId); if (!container) return;
      const options = {
        series: [{ name: 'Cantidad', data: datos.map(d => d.val) }],
        chart: {
          type: 'bar', height: 250, fontFamily: "'Plus Jakarta Sans', sans-serif",
          toolbar: { show: false }, dropShadow: { enabled: true, top: 2, left: 0, blur: 4, color: colorHex, opacity: 0.18 },
          animations: { enabled: true, easing: 'easeout', speed: 500, animateGradually: { enabled: true, delay: 90 }, dynamicAnimation: { enabled: true, speed: 300 } },
          events: { click: (e, ctx, cfg) => { if (cfg.dataPointIndex !== undefined && datos[cfg.dataPointIndex]) abrirDetalleBarra('Filtro', campoFiltro, datos[cfg.dataPointIndex].label); } }
        },
        plotOptions: { bar: { horizontal: true, borderRadius: 8, borderRadiusApplication: 'end', barHeight: '62%', distributed: false } },
        states: { hover: { filter: { type: 'lighten', value: 0.08 } }, active: { filter: { type: 'darken', value: 0.1 } } },
        fill: {
          type: 'gradient',
          gradient: { shade: 'light', type: 'horizontal', shadeIntensity: 0.35, gradientToColors: [colorHex], inverseColors: false, opacityFrom: 0.85, opacityTo: 1, stops: [0, 100] }
        },
        colors: [colorHex],
        dataLabels: { enabled: true, style: { colors: ['#ffffff'], fontWeight: 700, fontSize: '11.5px' } },
        grid: { borderColor: '#eef2f7', strokeDashArray: 4, xaxis: { lines: { show: true } }, yaxis: { lines: { show: false } } },
        xaxis: { categories: datos.map(d => d.label), labels: { style: { colors: '#64748b', fontSize: '11px' } } },
        yaxis: { labels: { style: { colors: '#334155', fontSize: '12px', fontWeight: 600 } } },
        tooltip: { theme: 'dark', style: { fontFamily: "'Plus Jakarta Sans', sans-serif" }, y: { formatter: (v) => v + ' registro(s)' } }
      };
      CHART_INSTANCES[elId] = new ApexCharts(container, options); CHART_INSTANCES[elId].render();
    }

    function abrirDetalleKpi(titulo, tipo, valFiltro) {
      let evs = filtrarEventos();
      if (tipo === 'sla') evs = evs.filter(e => e.diasProceso >= 3);
      else if (tipo === 'criticas') evs = evs.filter(e => e.esFallaCritica);
      mostrarModalConsolidado(titulo, evs);
    }

    function abrirDetalleBarra(titulo, campo, valor) {
      const evs = filtrarEventos().filter(e => (e[campo] || 'Sin especificar') === valor);
      mostrarModalConsolidado(titulo + ': "' + valor + '"', evs);
    }

    /* ============================================================================
     * MODAL DETALLADO Y DICTADO NATIVO DIRECTO EN PANTALLA (SIN BLOQUEOS)
     * ==========================================================================*/
    function mostrarModalConsolidado(titulo, eventosList) {
      document.getElementById('modalTitulo').textContent = titulo + ' (' + contarPedidosUnicos(eventosList) + ' Pedidos / ' + eventosList.length + ' Equipos)';
      const body = document.getElementById('modalBody');

      if (!eventosList.length) { body.innerHTML = '<div class="vacio">No hay registros para mostrar.</div>'; return; }

      const agrupadosPorPedido = {};
      eventosList.forEach(e => {
        const p = e.pedido || 'Sin Pedido';
        if (!agrupadosPorPedido[p]) agrupadosPorPedido[p] = { pedido: p, cliente: e.cliente, ciudad: e.ciudad, fecha: e.fechaSolicitud, items: [] };
        agrupadosPorPedido[p].items.push(e);
      });

      body.innerHTML = '<div class="consolidado-container">' + Object.keys(agrupadosPorPedido).map(numPed => {
        const grupo = agrupadosPorPedido[numPed];
        const idBase = numPed.replace(/[^a-zA-Z0-9]/g, '_');
        const txtId = 'txtComent_' + idBase;
        const listCommId = 'listComm_' + idBase;
        const previewId = 'previewAudio_' + idBase;
        const btnRecordId = 'btnRecord_' + idBase;

        cargarComentarios(grupo.pedido, listCommId);

        return `<div class="pedido-card">
          <div class="pedido-head">
            <span class="badge-pedido"># Pedido: ${grupo.pedido}</span>
            <span class="pedido-cliente">${grupo.cliente} (${grupo.ciudad})</span>
            <span class="badge-count">${grupo.items.length} equipo(s)</span>
          </div>
          <div class="pedido-body">
            ${grupo.items.map((it, idx) => `
              <div class="item-row">
                <div>#${idx+1} <b>${it.maquinaria}</b> <span class="code-activo">${it.codActivo || ''}</span></div>
                <div><span class="badge-accion">${it.accion}</span></div>
                <div><span class="tag-dias ${it.diasProceso >= 3 ? 'crit' : 'ok'}">${it.diasProceso} días</span></div>
                <div>${it.observacionDetalle || 'Sin detalle'}</div>
              </div>
            `).join('')}
            <div class="comments-section">
              <div class="comments-title">💬 Bitácora y Observaciones de Seguimiento</div>
              <div class="voice-input-wrap">
                <textarea id="${txtId}" class="comment-textarea" placeholder="Escribe tu observación (opcional si grabas una nota de voz)..."></textarea>
                <button type="button" id="${btnRecordId}" class="btn-record" onclick="alternarGrabacion('${btnRecordId}', '${previewId}')">🎙️ Grabar nota de voz</button>
              </div>
              <div id="${previewId}" class="audio-preview"></div>
              <button class="btn-save-comment" onclick="guardarComentarioUI('${grupo.pedido}', '${txtId}', '${listCommId}', '${previewId}')">💾 Guardar en la bitácora</button>
              <div id="${listCommId}" class="comments-history"><i>Cargando historial de bitácora...</i></div>
            </div>
          </div>
        </div>`;
      }).join('') + '</div>';

      document.getElementById('modal').classList.add('show');
    }

    function cerrarModal() {
      if (MEDIA_RECORDER && MEDIA_RECORDER.state === 'recording') MEDIA_RECORDER.stop();
      document.getElementById('modal').classList.remove('show');
    }

    /* ============================================================================
     * BITÁCORA: TEXTO + NOTA DE VOZ REAL (MediaRecorder) VÍA APPS SCRIPT
     * ==========================================================================*/
    let MEDIA_RECORDER = null;
    let AUDIO_CHUNKS = [];
    let AUDIO_STREAM = null;
    let AUDIO_BLOB_PENDIENTE = null;

    async function alternarGrabacion(btnId, previewId) {
      const btn = document.getElementById(btnId);

      if (MEDIA_RECORDER && MEDIA_RECORDER.state === 'recording') {
        MEDIA_RECORDER.stop();
        return;
      }

      if (!navigator.mediaDevices || !window.MediaRecorder) {
        alert('Tu navegador no soporta grabación de audio. Usa Google Chrome o Edge.');
        return;
      }

      try {
        AUDIO_STREAM = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        alert('No se pudo acceder al micrófono. Revisa los permisos del navegador para este sitio.');
        return;
      }

      AUDIO_CHUNKS = [];
      MEDIA_RECORDER = new MediaRecorder(AUDIO_STREAM);

      MEDIA_RECORDER.ondataavailable = (e) => { if (e.data && e.data.size > 0) AUDIO_CHUNKS.push(e.data); };

      MEDIA_RECORDER.onstop = () => {
        AUDIO_STREAM.getTracks().forEach(t => t.stop());
        const blob = new Blob(AUDIO_CHUNKS, { type: MEDIA_RECORDER.mimeType || 'audio/webm' });
        AUDIO_BLOB_PENDIENTE = blob;

        const preview = document.getElementById(previewId);
        if (preview) {
          const url = URL.createObjectURL(blob);
          preview.innerHTML = `<audio controls src="${url}"></audio><button type="button" class="btn-clear-audio" onclick="quitarGrabacionPendiente('${previewId}')">✕ Quitar</button>`;
        }
        if (btn) { btn.classList.remove('recording'); btn.innerHTML = '🎙️ Grabar nota de voz'; }
      };

      MEDIA_RECORDER.start();
      if (btn) { btn.classList.add('recording'); btn.innerHTML = '⏹ Detener grabación'; }
    }

    function quitarGrabacionPendiente(previewId) {
      AUDIO_BLOB_PENDIENTE = null;
      const preview = document.getElementById(previewId);
      if (preview) preview.innerHTML = '';
    }

    function blobABase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(String(reader.result).split(',')[1] || '');
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function cargarComentarios(pedido, contenedorId) {
      try {
        const res = await fetch(`${COMENTARIOS_API_URL}?action=getComentarios&pedido=${encodeURIComponent(pedido)}`);
        const data = await res.json();
        const cont = document.getElementById(contenedorId);
        if (!cont) return;
        if (data.exito && data.comentarios.length > 0) {
          cont.innerHTML = data.comentarios.map(c => `
            <div class="comment-item">
              <div class="comment-item-head">
                <span class="comment-user">👤 ${c.usuario}</span>
                <span class="comment-date">${c.fecha}</span>
              </div>
              ${c.texto ? `<div id="txt_val_${c.id}">${c.texto}</div>` : ''}
              ${c.audioUrl ? `<audio class="comment-audio" controls preload="none" src="${c.audioUrl}"></audio>` : ''}
              <div class="comment-actions">
                ${c.texto ? `<button class="btn-action-comm edit" onclick="editarComentario('${c.id}', '${pedido}', '${contenedorId}')">✏️ Editar</button>` : ''}
                <button class="btn-action-comm del" onclick="eliminarComentario('${c.id}', '${pedido}', '${contenedorId}')">🗑️ Eliminar</button>
              </div>
            </div>
          `).join('');
        } else {
          cont.innerHTML = '<span style="color:var(--muted); font-size:11.5px;">No hay observaciones registradas en la bitácora para este pedido.</span>';
        }
      } catch (e) { console.error(e); }
    }

    async function guardarComentarioUI(pedido, txtId, contenedorId, previewId) {
      const txt = document.getElementById(txtId).value.trim();
      if (!txt && !AUDIO_BLOB_PENDIENTE) return alert('Escribe un comentario o graba una nota de voz antes de guardar.');

      loader(true);
      try {
        let audioBase64 = null, audioMime = null;
        if (AUDIO_BLOB_PENDIENTE) {
          audioBase64 = await blobABase64(AUDIO_BLOB_PENDIENTE);
          audioMime = AUDIO_BLOB_PENDIENTE.type || 'audio/webm';
        }

        const res = await fetch(COMENTARIOS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'guardarComentario', pedido: pedido, usuario: 'Operador Web', textoComentario: txt, audioBase64: audioBase64, audioMime: audioMime })
        });
        const data = await res.json();
        if (!data.exito) {
          alert('El servidor rechazó el guardado:\n\n' + (data.error || 'Error desconocido.'));
          loader(false);
          return;
        }

        document.getElementById(txtId).value = '';
        quitarGrabacionPendiente(previewId);
        await cargarComentarios(pedido, contenedorId);
      } catch (e) { alert('Error al guardar: ' + e); }
      loader(false);
    }

    async function editarComentario(idComentario, pedido, contenedorId) {
      const elemTexto = document.getElementById('txt_val_' + idComentario);
      const actual = elemTexto ? elemTexto.innerText : '';
      const nuevoTexto = prompt('Edita tu comentario / observación:', actual);
      if (nuevoTexto !== null && nuevoTexto.trim() !== '') {
        loader(true);
        await fetch(COMENTARIOS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'editarComentario', idComentario: idComentario, nuevoTexto: nuevoTexto.trim() })
        });
        await cargarComentarios(pedido, contenedorId);
        loader(false);
      }
    }

    async function eliminarComentario(idComentario, pedido, contenedorId) {
      if (confirm('¿Estás seguro de que deseas eliminar este comentario?')) {
        loader(true);
        await fetch(COMENTARIOS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'eliminarComentario', idComentario: idComentario })
        });
        await cargarComentarios(pedido, contenedorId);
        loader(false);
      }
    }
  </script>
</body>
