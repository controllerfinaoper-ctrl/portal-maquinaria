    .badge-pedido { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 13px; color: var(--cl-azul); background: var(--cl-azul-light); padding: 4px 10px; border-radius: 8px; }

    #loader {
      position: fixed; inset: 0; background: rgba(10, 51, 86, 0.55); display: flex;

    @media (max-width: 1200px) { .grid { grid-template-columns: repeat(2, 1fr); } }

  <script>

    const CONFIG_ACCIONES = {
      'Iniciacion':            { icono: '📦', color: '#7ab833', label: 'Iniciaciones / Entregas' },
      'Iniciación':            { icono: '📦', color: '#7ab833', label: 'Iniciaciones / Entregas' },
      'MantenimientoCorrectivo': { icono: '🛠️', color: '#0082c8', label: 'Mantenimientos' },

    const PALABRAS_FALLA_CRITICA = ['EN CORTO', 'NO PRENDE', 'CORTOCIRCUITO', 'NO ENCIENDE'];

    function normTexto(s) {
      if (!s) return '';
      return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('inputBusqueda').addEventListener('input', (e) => { ESTADO.busqueda = e.target.value; render(); });
      document.getElementById('inputFechaDia').addEventListener('change', (e) => { ESTADO.fechaDiaSel = e.target.value; render(); });
      document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') cerrarModal(); });
      
      const cacheGuardada = localStorage.getItem('cmi_cache_datos');
      if (cacheGuardada) {
        try {
          const dataCache = JSON.parse(cacheGuardada);
          inicializar(dataCache);
        } catch(e){}
      }
      cargarDatos(false);
    });

    function loader(show) { document.getElementById('loader').classList.toggle('show', !!show); }

    async function cargarDatos(forzarSinCache) {
      if (forzarSinCache || !localStorage.getItem('cmi_cache_datos')) loader(true);
      try {
        const data = await obtenerDatosDesdeSheet();
        localStorage.setItem('cmi_cache_datos', JSON.stringify(data));
        inicializar(data);
      } catch (e) {
        console.error("Error al cargar datos:", e);
      }
      loader(false);
    }

    function cargarJsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = 'gvizCallback_' + Date.now();
        const script = document.createElement('script');
        const limpiar = () => { delete window[callbackName]; script.remove(); };
        window[callbackName] = (json) => { limpiar(); resolve(json); };
        script.onerror = () => { limpiar(); reject(new Error('Error al conectar con Google Sheets')); };
        script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'tqx=out:json;responseHandler:' + callbackName;
        document.body.appendChild(script);
      });
    }

    async function obtenerDatosDesdeSheet() {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(NOMBRE_HOJA)}&_=${Date.now()}`;
      const json = await cargarJsonp(url);
      const cols = (json.table && json.table.cols) || [];
      const filas = (json.table && json.table.rows) || [];

      const colIndex = {};
      cols.forEach((c, i) => { if (c.label) colIndex[normTexto(c.label)] = i; });

      function buscarCol(nombres) {
        for (const n of nombres) { const idx = colIndex[normTexto(n)]; if (idx !== undefined) return idx; }
        return -1;
      }

      const idx = {
        pedido:     buscarCol(['# Pedido', 'Pedido']),
        cliente:    buscarCol(['Cliente']),
        ciudad:     buscarCol(['Ciudad']),
        fechaSol:   buscarCol(['Fecha de solicitud']),
        diasProc:   buscarCol(['Dias En Proceso']),
        estado:     buscarCol(['Estado']),
        accion:     buscarCol(['Accion']),
        maquinaria: buscarCol(['Maquinaria']),
        codActivo:  buscarCol(['Cod. Activo', 'Placa']),
        obsDetalle: buscarCol(['Observacion Detalle']),
        estEntrega: buscarCol(['Estado de Entrega'])
      };

      function celda(fila, i) { return (i === -1 || !fila.c || !fila.c[i]) ? null : fila.c[i]; }
      function txt(fila, i) {
        const c = celda(fila, i);
        if (!c) return '';
        const val = (c.f !== undefined && c.f !== null) ? c.f : c.v;
        return (val === undefined || val === null) ? '' : String(val).trim();
      }
      function num(fila, i) {
        const c = celda(fila, i);
        if (!c || c.v === null || c.v === undefined) return 0;
        const n = Number(c.v); return isNaN(n) ? 0 : n;
      }

      function extraerPeriodo(fechaStr) {
        if (!fechaStr) return 'Sin fecha';
        const partes = fechaStr.split('/');
        if (partes.length === 3) return partes[2] + '-' + (partes[1].length < 2 ? '0' + partes[1] : partes[1]);
        return 'Sin fecha';
      }

      function moduloDeAccion(accion) {
        const normAcc = normTexto(accion);
        for (const clave of Object.keys(MODULOS)) {
          if (clave === 'general') continue;
          if (MODULOS[clave].acciones && MODULOS[clave].acciones.some(a => normTexto(a) === normAcc)) return clave;
        }
        return 'otros';
      }

      const eventos = [];
      filas.forEach(fila => {
        const pedido = txt(fila, idx.pedido);
        if (!pedido) return;
        const accion = txt(fila, idx.accion) || 'Sin acción';
        const obsDetalle = txt(fila, idx.obsDetalle);
        const fSolicitud = (celda(fila, idx.fechaSol) && celda(fila, idx.fechaSol).f) ? String(celda(fila, idx.fechaSol).f).trim() : '';

        eventos.push({
          pedido, cliente: txt(fila, idx.cliente) || 'Sin cliente', ciudad: txt(fila, idx.ciudad) || 'Sin ciudad',
          fechaSolicitud: fSolicitud, periodo: extraerPeriodo(fSolicitud), diasProceso: num(fila, idx.diasProc),
          estado: txt(fila, idx.estado) || 'Sin estado', accion, modulo: moduloDeAccion(accion),
          maquinaria: txt(fila, idx.maquinaria) || 'Sin especificar', codActivo: txt(fila, idx.codActivo),
          observacionDetalle: obsDetalle,
          esFallaCritica: obsDetalle ? PALABRAS_FALLA_CRITICA.some(p => obsDetalle.toUpperCase().indexOf(p) >= 0) : false,
          estadoEntrega: txt(fila, idx.estEntrega) || 'Sin estado entrega'
        });
      });

      function unicos(campo) {
        const vistos = {}; eventos.forEach(e => { if (e[campo]) vistos[e[campo]] = true; });
        return Object.keys(vistos).sort((a, b) => a.localeCompare(b, 'es'));
      }

      return {
        eventos,
        filtros: { clientes: unicos('cliente'), ciudades: unicos('ciudad'), acciones: unicos('accion'), estados: unicos('estado'), estadosEntrega: unicos('estadoEntrega'), periodos: unicos('periodo') },
        modulos: MODULOS,
        actualizado: new Date().toLocaleString('es-CO', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit', hour12: true })
      };
    }

    function inicializar(data) {
      ESTADO.eventos = data.eventos || [];
      ESTADO.filtros = data.filtros || {};
      ESTADO.modulos = data.modulos || {};
      ESTADO.actualizado = data.actualizado || '—';

      document.getElementById('actualizado').textContent = ESTADO.actualizado;
      construirDock();
      poblarCombos();
      render();
    }

    function construirDock() {
      const dock = document.getElementById('dockBar');
      if (!dock) return;
      dock.innerHTML = Object.keys(ESTADO.modulos).map(k => {
        const m = ESTADO.modulos[k];
        const active = (k === ESTADO.moduloSel) ? 'active' : '';
        return `<button class="dock-item ${active}" onclick="cambiarModulo('${k}')">
          <span class="dock-label">${m.label}</span>
          <span aria-hidden="true">${m.icono}</span>
        </button>`;
      }).join('');
    }

    function cambiarModulo(key) {
      ESTADO.moduloSel = key;
      construirDock();
      render();
    }

    function crearComboMultiples(contenedorId, opciones, seleccionados, alCambiar, etiquetaTodos) {
      const container = document.getElementById(contenedorId);
      if (!container) return;
      const opcionesList = opciones || [];

      const obtenerTextoBoton = () => {
        if (!seleccionados || seleccionados.length === 0) return etiquetaTodos;
        if (seleccionados.length === 1) return seleccionados[0];
        return seleccionados.length + ' seleccionados';
      };

      container.innerHTML = `
        <div class="combo-wrap">
          <input type="text" class="combo-input" value="${obtenerTextoBoton()}" readonly>
          <span class="combo-arrow">▾</span>
          <div class="combo-panel">
            <input type="text" class="combo-search" placeholder="🔍 Buscar...">
            <div class="combo-actions">
              <button type="button" class="btn-all">Todos</button>
              <button type="button" class="btn-none">Limpiar</button>
            </div>
            <div class="combo-list"></div>
          </div>
        </div>
      `;

      const wrap = container.querySelector('.combo-wrap');
      const input = container.querySelector('.combo-input');
      const panel = container.querySelector('.combo-panel');
      const search = container.querySelector('.combo-search');
      const list = container.querySelector('.combo-list');

      const renderizarLista = (filtro) => {
        const filtrados = opcionesList.filter(it => !filtro || it.toLowerCase().indexOf(filtro.toLowerCase()) >= 0);
        if (!filtrados.length) { list.innerHTML = '<div style="padding:8px;font-size:11px;">Sin resultados</div>'; return; }
        list.innerHTML = filtrados.map(it => {
          const isChecked = seleccionados.indexOf(it) >= 0 ? 'checked' : '';
          return `<label class="combo-item-multi"><input type="checkbox" value="${it.replace(/"/g, '&quot;')}" ${isChecked}><span>${it}</span></label>`;
        }).join('');
      };

      input.addEventListener('click', () => {
        document.querySelectorAll('.combo-panel.show').forEach(p => { if(p !== panel) p.classList.remove('show'); });
        panel.classList.toggle('show');
        if (panel.classList.contains('show')) { search.value = ''; renderizarLista(''); search.focus(); }
      });

      search.addEventListener('input', () => renderizarLista(search.value));
      list.addEventListener('change', (e) => {
        if (e.target.tagName === 'INPUT') {
          const val = e.target.value;
          if (e.target.checked) { if (seleccionados.indexOf(val) < 0) seleccionados.push(val); }
          else { const idx = seleccionados.indexOf(val); if (idx >= 0) seleccionados.splice(idx, 1); }
          input.value = obtenerTextoBoton(); alCambiar(seleccionados);
        }
      });

      container.querySelector('.btn-all').addEventListener('click', () => {
        seleccionados.length = 0; opcionesList.forEach(it => seleccionados.push(it));
        renderizarLista(search.value); input.value = obtenerTextoBoton(); alCambiar(seleccionados);
      });
      container.querySelector('.btn-none').addEventListener('click', () => {
        seleccionados.length = 0; renderizarLista(search.value); input.value = obtenerTextoBoton(); alCambiar(seleccionados);
      });
      document.addEventListener('click', (e) => { if (!wrap.contains(e.target)) panel.classList.remove('show'); });
    }

    function poblarCombos() {
      crearComboMultiples('comboPeriodo', ESTADO.filtros.periodos, ESTADO.periodoSel, v => { ESTADO.periodoSel = v; render(); }, 'Todos los periodos');
      crearComboMultiples('comboCliente', ESTADO.filtros.clientes, ESTADO.clienteSel, v => { ESTADO.clienteSel = v; render(); }, 'Todos los clientes');
      crearComboMultiples('comboCiudad', ESTADO.filtros.ciudades, ESTADO.ciudadSel, v => { ESTADO.ciudadSel = v; render(); }, 'Todas las ciudades');
      crearComboMultiples('comboEstado', ESTADO.filtros.estados, ESTADO.estadoSel, v => { ESTADO.estadoSel = v; render(); }, 'Todos los estados');
      crearComboMultiples('comboEstadoEntrega', ESTADO.filtros.estadosEntrega, ESTADO.estadoEntregaSel, v => { ESTADO.estadoEntregaSel = v; render(); }, 'Todos los estados entrega');
      crearComboMultiples('comboAccion', ESTADO.filtros.acciones, ESTADO.accionSel, v => { ESTADO.accionSel = v; render(); }, 'Todas las acciones');
    }

    function limpiarFiltros() {
      ESTADO.periodoSel = []; ESTADO.fechaDiaSel = ''; ESTADO.clienteSel = []; ESTADO.ciudadSel = [];
      ESTADO.estadoSel = []; ESTADO.estadoEntregaSel = []; ESTADO.accionSel = []; ESTADO.busqueda = '';
      document.getElementById('inputFechaDia').value = '';
      document.getElementById('inputBusqueda').value = '';
      poblarCombos(); render();
    }

    function filtrarEventos() {
      return ESTADO.eventos.filter(e => {
        if (ESTADO.moduloSel !== 'general' && e.modulo !== ESTADO.moduloSel) return false;
        if (ESTADO.periodoSel.length > 0 && ESTADO.periodoSel.indexOf(e.periodo) < 0) return false;
        if (ESTADO.clienteSel.length > 0 && ESTADO.clienteSel.indexOf(e.cliente) < 0) return false;
        if (ESTADO.ciudadSel.length > 0 && ESTADO.ciudadSel.indexOf(e.ciudad) < 0) return false;
        if (ESTADO.estadoSel.length > 0 && ESTADO.estadoSel.indexOf(e.estado) < 0) return false;
        if (ESTADO.estadoEntregaSel.length > 0 && ESTADO.estadoEntregaSel.indexOf(e.estadoEntrega) < 0) return false;
        if (ESTADO.accionSel.length > 0 && ESTADO.accionSel.indexOf(e.accion) < 0) return false;
        if (ESTADO.busqueda) {
          const q = ESTADO.busqueda.toLowerCase();
          const txtMatch = (e.pedido + ' ' + e.codActivo + ' ' + e.maquinaria + ' ' + e.cliente + ' ' + e.observacionDetalle).toLowerCase();
          if (txtMatch.indexOf(q) < 0) return false;
        }
        return true;
      });
    }

    function contarPedidosUnicos(evs) {
      const vistos = {}; evs.forEach(e => { if (e.pedido) vistos[e.pedido] = true; });
      return Object.keys(vistos).length;
    }

    function renderTarjetasAcciones(evs) {
      const wrap = document.getElementById('accionesSummaryWrap');
      if (!wrap) return;

      const conteoAcciones = {};
      evs.forEach(e => {
        const acc = e.accion || 'Sin especificación';
        if (!conteoAcciones[acc]) conteoAcciones[acc] = { pedidos: {}, totalItems: 0 };
        if (e.pedido) conteoAcciones[acc].pedidos[e.pedido] = true;
        conteoAcciones[acc].totalItems++;
      });

      const listaAcciones = Object.keys(conteoAcciones).sort((a, b) => Object.keys(conteoAcciones[b].pedidos).length - Object.keys(conteoAcciones[a].pedidos).length);

      wrap.innerHTML = listaAcciones.map(acc => {
        const numPedidos = Object.keys(conteoAcciones[acc].pedidos).length;
        const totalItems = conteoAcciones[acc].totalItems;
        const conf = CONFIG_ACCIONES[acc] || { icono: '⚡', color: '#0082c8', label: acc };

        return `<div class="card-accion-kpi" style="--accent-color:${conf.color}" onclick="abrirDetalleBarra('Acción', 'accion', '${acc.replace(/'/g, "\\'")}')">
          <div class="card-accion-title"><span>${conf.label}</span><span>${conf.icono}</span></div>
          <div class="card-accion-val">${numPedidos}</div>
          <div class="card-accion-sub">Pedidos únicos (${totalItems} ítems)</div>
        </div>`;
      }).join('');
    }

    function render() {
      Object.keys(CHART_INSTANCES).forEach(k => { if (CHART_INSTANCES[k]) CHART_INSTANCES[k].destroy(); });
      CHART_INSTANCES = {};

      const evs = filtrarEventos();
      document.getElementById('chipPedidos').textContent = contarPedidosUnicos(evs) + ' Pedidos Únicos';
      document.getElementById('chipItems').textContent = '(' + evs.length + ' ítems)';

      renderTarjetasAcciones(evs);

      const grid = document.getElementById('grid');
      if (!evs.length) { grid.innerHTML = '<div class="vacio">No hay solicitudes que coincidan.</div>'; return; }

      let html = '';
      if (ESTADO.moduloSel === 'general') html = renderVista360(evs);
      else if (ESTADO.moduloSel === 'mantenimiento') html = renderMantenimiento(evs);
      else if (ESTADO.moduloSel === 'entregas') html = renderEntregas(evs);
      else if (ESTADO.moduloSel === 'recogidas') html = renderRecogidas(evs);
      else if (ESTADO.moduloSel === 'accesorios') html = renderAccesorios(evs);

      grid.innerHTML = html;
      setTimeout(() => renderizarGraficosApex(evs), 30);
    }

    function renderVista360(evs) {
      const promDias = evs.length ? Math.round(evs.reduce((a, b) => a + b.diasProceso, 0) / evs.length) : 0;
      const criticos = evs.filter(e => e.diasProceso >= 3);
      return `<div class="col">
        ${cardKPI('Total Pedidos Únicos', contarPedidosUnicos(evs), 'órdenes', 'verde', evs.length + ' ítems en total', 'general')}
        ${cardKPI('Promedio Días en Proceso', promDias, 'días', 'neu', 'Tiempo promedio acumulado', 'general')}
        ${cardKPI('Fuera de SLA (≥ 3 días)', contarPedidosUnicos(criticos), 'órdenes', criticos.length > 0 ? 'rojo' : 'verde', criticos.length + ' ítems con retraso', 'sla')}
      </div>
      <div class="col">
        ${cardChartBox('Tendencia de Pedidos (Mes a Mes)', 'chartTendencia')}
        ${cardChartBox('Top Fallas Frecuentes', 'chartFallas')}
      </div>
      <div class="col">
        ${cardChartBox('Equipos Más Solicitados', 'chartEquipos')}
        ${cardChartBox('Top Clientes con Requerimientos', 'chartClientes')}
      </div>`;
    }

    function renderMantenimiento(evs) {
      const fallasCrit = evs.filter(e => e.esFallaCritica);
      return `<div class="col">
        ${cardKPI('Mantenimientos Correctivos', contarPedidosUnicos(evs), 'órdenes', 'neu', evs.length + ' averías reportadas', 'general')}
        ${cardKPI('Fallas Críticas ("En Corto")', contarPedidosUnicos(fallasCrit), 'órdenes', 'rojo', fallasCrit.length + ' casos críticos', 'criticas')}
      </div>
      <div class="col">${cardChartBox('Principales Fallas Reportadas', 'chartFallas')}</div>
      <div class="col">${cardChartBox('Equipos con Mayor Tasa de Falla', 'chartEquipos')}</div>`;
    }

    function renderEntregas(evs) {
      return `<div class="col">${cardKPI('Solicitudes de Entrega', contarPedidosUnicos(evs), 'órdenes', 'verde', evs.length + ' asignados', 'general')}</div>
      <div class="col">${cardChartBox('Equipos Entregados por Tipo', 'chartEquipos')}</div>
      <div class="col">${cardChartBox('Destino por Cliente', 'chartClientes')}</div>`;
    }

    function renderRecogidas(evs) {
      return `<div class="col">${cardKPI('Recogidas y Terminaciones', contarPedidosUnicos(evs), 'órdenes', 'amarillo', evs.length + ' retiros', 'general')}</div>
      <div class="col">${cardChartBox('Motivo de Retiro / Cierre', 'chartAcciones')}</div>
      <div class="col">${cardChartBox('Sedes en Recogida', 'chartClientes')}</div>`;
    }

    function renderAccesorios(evs) {
      return `<div class="col">${cardKPI('Requerimiento de Accesorios', contarPedidosUnicos(evs), 'órdenes', 'neu', evs.length + ' insumos pedidos', 'general')}</div>
      <div class="col">${cardChartBox('Accesorios Más Pedidos', 'chartEquipos')}</div>
      <div class="col">${cardChartBox('Consumo por Cliente', 'chartClientes')}</div>`;
    }

    function cardKPI(titulo, valor, unidad, semaforo, sub, filtroTipo, valorFiltro) {
      return `<div class="card clickable" onclick="abrirDetalleKpi('${titulo}', '${filtroTipo}', '${valorFiltro || ''}')">
        <div class="card-top"><span class="card-title">${titulo}</span><span class="dot ${semaforo}"></span></div>
        <div class="card-body"><span class="big">${valor}</span><span class="u">${unidad}</span></div>
        <div class="card-foot">${sub}</div>
      </div>`;
    }

    function cardChartBox(titulo, chartId) {
      return `<div class="card"><div class="card-top"><span class="card-title">${titulo}</span></div><div id="${chartId}" class="chart-container"></div></div>`;
    }

    function agrupar(evs, campo, top) {
      const conteo = {}; evs.forEach(e => { const val = e[campo] || 'Sin especificar'; conteo[val] = (conteo[val] || 0) + 1; });
      return Object.keys(conteo).map(k => ({ label: k, val: conteo[k] })).sort((a,b) => b.val - a.val).slice(0, top || 6);
    }

    function agruparPorPeriodo(evs) {
      const conteo = {};
      evs.forEach(e => {
        const p = (e.periodo && e.periodo !== 'Sin fecha') ? e.periodo : 'Sin fecha';
        conteo[p] = (conteo[p] || 0) + 1;
      });
      const periodos = Object.keys(conteo).sort();
      return periodos.map(p => ({ label: p, val: conteo[p] }));
    }

    function renderizarGraficosApex(evs) {
      if (document.getElementById('chartTendencia')) {
        const datosTendencia = agruparPorPeriodo(evs);
        renderGraficoLinea('chartTendencia', datosTendencia, '#0082c8');
      }

      if (document.getElementById('chartFallas')) renderBarraHorizontal('chartFallas', agrupar(evs, 'observacionDetalle', 5), 'observacionDetalle', '#0082c8');
      if (document.getElementById('chartEquipos')) renderBarraHorizontal('chartEquipos', agrupar(evs, 'maquinaria', 5), 'maquinaria', '#7ab833');
      if (document.getElementById('chartClientes')) renderBarraHorizontal('chartClientes', agrupar(evs, 'cliente', 5), 'cliente', '#0a3356');
    }

    function renderGraficoLinea(elId, datos, colorHex) {
      const container = document.getElementById(elId);
      if (!container) return;

      if (!datos || !datos.length) {
        container.innerHTML = '<div class="vacio" style="padding: 20px;">Sin datos de tendencia</div>';
        return;
      }

      const options = {
        series: [{ name: 'Solicitudes', data: datos.map(d => d.val) }],
        chart: { type: 'area', height: 250, fontFamily: "'Plus Jakarta Sans', sans-serif", toolbar: { show: false } },
        stroke: { curve: 'smooth', width: 3 },
        colors: [colorHex],
        fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.45, opacityTo: 0.05, stops: [0, 100] } },
        dataLabels: { enabled: true, style: { fontSize: '11px', fontWeight: 'bold' } },
        xaxis: { categories: datos.map(d => d.label) },
        tooltip: { y: { formatter: (val) => val + ' solicitudes' } }
      };
      CHART_INSTANCES[elId] = new ApexCharts(container, options);
      CHART_INSTANCES[elId].render();
    }

    function renderBarraHorizontal(elId, datos, campoFiltro, colorHex) {
      const container = document.getElementById(elId); if (!container) return;
      const options = {
        series: [{ name: 'Cantidad', data: datos.map(d => d.val) }],
        chart: { type: 'bar', height: 250, fontFamily: "'Plus Jakarta Sans', sans-serif", toolbar: { show: false } },
        plotOptions: { bar: { horizontal: true, borderRadius: 6 } },
        colors: [colorHex],
        dataLabels: { enabled: true, style: { colors: ['#ffffff'], fontWeight: 700 } },
        xaxis: { categories: datos.map(d => d.label) }
      };
      CHART_INSTANCES[elId] = new ApexCharts(container, options); CHART_INSTANCES[elId].render();
    }

    function abrirDetalleKpi(titulo, tipo, valFiltro) {
      let evs = filtrarEventos();
      if (tipo === 'sla') evs = evs.filter(e => e.diasProceso >= 3);
      else if (tipo === 'criticas') evs = evs.filter(e => e.esFallaCritica);
      mostrarModalConsolidado(titulo, evs);
    }

    function abrirDetalleBarra(titulo, campo, valor) {
      const evs = filtrarEventos().filter(e => (e[campo] || 'Sin especificar') === valor);
      mostrarModalConsolidado(titulo + ': "' + valor + '"', evs);
    }

    function mostrarModalConsolidado(titulo, eventosList) {
      document.getElementById('modalTitulo').textContent = titulo + ' (' + contarPedidosUnicos(eventosList) + ' Pedidos / ' + eventosList.length + ' Equipos)';
      const body = document.getElementById('modalBody');

      if (!eventosList.length) { body.innerHTML = '<div class="vacio">No hay registros para mostrar.</div>'; return; }

      const agrupadosPorPedido = {};
      eventosList.forEach(e => {
        const p = e.pedido || 'Sin Pedido';
        if (!agrupadosPorPedido[p]) agrupadosPorPedido[p] = { pedido: p, cliente: e.cliente, ciudad: e.ciudad, fecha: e.fechaSolicitud, items: [] };
        agrupadosPorPedido[p].items.push(e);
      });

      const pedidosKeys = Object.keys(agrupadosPorPedido);
      
      body.innerHTML = '<div class="consolidado-container">' + pedidosKeys.slice(0, 50).map(numPed => {
        const grupo = agrupadosPorPedido[numPed];
        const idBase = numPed.replace(/[^a-zA-Z0-9]/g, '_');
        const txtId = 'txtComent_' + idBase;
        const listCommId = 'listComm_' + idBase;

        cargarComentarios(grupo.pedido, listCommId);

        return `<div class="pedido-card">
          <div class="pedido-head">
            <span class="badge-pedido"># Pedido: ${grupo.pedido}</span>
            <span class="pedido-cliente">${grupo.cliente} (${grupo.ciudad})</span>
            <span class="badge-count">${grupo.items.length} equipo(s)</span>
          </div>
          <div class="pedido-body">
            ${grupo.items.map((it, idx) => `
              <div class="item-row">
                <div>#${idx+1} <b>${it.maquinaria}</b> <span class="code-activo">${it.codActivo || ''}</span></div>
                <div><span class="badge-accion">${it.accion}</span></div>
                <div><span class="tag-dias ${it.diasProceso >= 3 ? 'crit' : 'ok'}">${it.diasProceso} días</span></div>
                <div>${it.observacionDetalle || 'Sin detalle'}</div>
              </div>
            `).join('')}
            <div class="comments-section">
              <div class="comments-title">💬 Bitácora y Observaciones de Seguimiento</div>
              <div class="voice-input-wrap">
                <textarea id="${txtId}" class="comment-textarea" placeholder="Escribe tu observación..."></textarea>
              </div>
              <button class="btn-save-comment" onclick="guardarComentarioUI('${grupo.pedido}', '${txtId}', '${listCommId}')">💾 Guardar en la bitácora</button>
              <div id="${listCommId}" class="comments-history"><i>Cargando historial...</i></div>
            </div>
          </div>
        </div>`;
      }).join('') + '</div>';

      document.getElementById('modal').classList.add('show');
    }

    function cerrarModal() {
      document.getElementById('modal').classList.remove('show');
    }

    async function cargarComentarios(pedido, contenedorId) {
      try {
        const res = await fetch(`${COMENTARIOS_API_URL}?action=getComentarios&pedido=${encodeURIComponent(pedido)}`);
        const data = await res.json();
        const cont = document.getElementById(contenedorId);
        if (!cont) return;
        if (data.exito && data.comentarios.length > 0) {
          cont.innerHTML = data.comentarios.map(c => `
            <div class="comment-item">
              <div class="comment-item-head">
                <span class="comment-user">👤 ${c.usuario}</span>
                <span class="comment-date">${c.fecha}</span>
              </div>
              ${c.texto ? `<div id="txt_val_${c.id}">${c.texto}</div>` : ''}
            </div>
          `).join('');
        } else {
          cont.innerHTML = '<span style="color:var(--muted); font-size:11.5px;">Sin observaciones registradas.</span>';
        }
      } catch (e){}
    }

    async function guardarComentarioUI(pedido, txtId, contenedorId) {
      const txt = document.getElementById(txtId).value.trim();
      if (!txt) return alert('Escribe un comentario antes de guardar.');

      loader(true);
      try {
        await fetch(COMENTARIOS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'guardarComentario', pedido: pedido, usuario: 'Operador Web', textoComentario: txt })
        });
        document.getElementById(txtId).value = '';
        await cargarComentarios(pedido, contenedorId);
      } catch (e) { alert('Error al guardar: ' + e); }
      loader(false);
    }
  </script>
</body>
</html>
