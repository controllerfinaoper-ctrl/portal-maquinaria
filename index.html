<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Operativo Casalimpia S.A.</title>
  
  <link rel="preconnect" href="https://docs.google.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex-Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

  <script>
    // 1. URL Servicio de Autenticación de Usuarios
    const API_URL_AUTH = "https://script.google.com/macros/s/AKfycbwnzuf3tr2X44WdsR1dvTdD654SZZjCoyGX_D868d7he2yLqj7NtiRb46jCsp5qg5YlcQ/exec";

    // 2. URL Módulo Seguimiento Pedidos (alertas_sla_pedidos)
    const API_URL_PEDIDOS = "https://script.google.com/macros/s/AKfycbx_TZYzsaGLnvLzSIaIPxFPaynkFENgno51jAaFJOBfAGFy1MExvmRhGZyFxd40h0DI/exec";

    // 3. URL Módulos Operativos de Maquinaria (TBLPedidosMaquinaria)
    const API_URL_MAQUINARIA = "https://script.google.com/macros/s/AKfycbxy2LWhm91ANHDdhqX-h_rrXoTl1cu3kyR8_8Q4Hlx_7cpM2QmDDT79IfzGzqYtC0ex/exec";
  </script>

  <style>
    :root {
      --cl-verde: #7ab833;
      --cl-verde-hover: #69a727;
      --cl-verde-light: #f1f8e9;
      --cl-azul: #0082c8;
      --cl-azul-hover: #006eb3;
      --cl-azul-dark: #0a3356;
      --cl-azul-light: #e0f2fe;
      --bg-main: #f8fafc;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --verde-ok: #22c55e;
      --amarillo-warn: #eab308;
      --rojo-crit: #ef4444;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
    html { scroll-behavior: smooth; }

    ::-webkit-scrollbar { display: none; width: 0; height: 0; }
    html, body { -ms-overflow-style: none; scrollbar-width: none; }

    body.no-scroll { overflow: hidden !important; height: 100vh; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: #f8fafc;
      min-height: 100vh;
    }

    .signin-overlay {
      position: fixed; inset: 0; z-index: 999999;
      background: radial-gradient(circle at top center, #0082c8 0%, #0a3356 60%, #021427 100%);
      display: flex; align-items: center; justify-content: center; padding: 20px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .signin-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .signin-card {
      width: 100%; max-width: 400px; background: rgba(10, 51, 86, 0.65);
      backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px; padding: 32px 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      color: #ffffff; position: relative; overflow: hidden; transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
    }

    .signin-card::before {
      content: ''; position: absolute; inset: -1px; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, var(--cl-verde), transparent);
    }

    .signin-header { text-align: center; margin-bottom: 24px; }
    .signin-logo { height: 48px; background: #ffffff; padding: 8px 16px; border-radius: 12px; display: inline-block; margin-bottom: 12px; }
    .signin-title { font-size: 20px; font-weight: 800; color: #ffffff; margin: 0; }
    .signin-sub { font-size: 12px; color: #93c5fd; margin-top: 4px; }

    .signin-form { display: flex; flex-direction: column; gap: 16px; }
    .input-group { position: relative; display: flex; align-items: center; }
    .input-group svg { position: absolute; left: 14px; width: 18px; height: 18px; color: #93c5fd; }
    .input-field {
      width: 100%; height: 44px; background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px;
      padding: 0 40px 0 42px; color: #ffffff; font-size: 13px; outline: none;
      transition: all 0.2s ease;
    }
    .input-field:focus { border-color: var(--cl-verde); background: rgba(255, 255, 255, 0.15); box-shadow: 0 0 12px rgba(122, 184, 51, 0.3); }
    .input-field::placeholder { color: rgba(255, 255, 255, 0.4); }

    .toggle-pass { position: absolute; right: 14px; cursor: pointer; color: #93c5fd; }

    .btn-signin {
      height: 44px; background: var(--cl-verde); color: #ffffff; border: none;
      border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s ease; box-shadow: 0 4px 16px rgba(122, 184, 51, 0.4);
    }
    .btn-signin:hover { background: var(--cl-verde-hover); transform: translateY(-1px); }

    .error-msg { font-size: 12px; color: #fca5a5; text-align: center; display: none; background: rgba(239, 68, 68, 0.2); padding: 8px; border-radius: 8px; }

    .user-pill { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.1); padding: 6px 12px; border-radius: 999px; font-size: 12px; }
    .btn-logout { background: transparent; border: none; color: #fca5a5; cursor: pointer; font-weight: 700; font-size: 11px; }

    .wrap { max-width: 1750px; margin: 0 auto; padding: 20px 24px 60px; position: relative; z-index: 1; }

    header {
      display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 28px;
      border-radius: 24px; background: #0a3356; border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2); color: #fff;
    }
    .brand { display: flex; align-items: center; gap: 18px; }
    .logo-header-wrap { display: flex; align-items: center; justify-content: center; background: #ffffff; padding: 8px 16px; border-radius: 16px; }
    .header-logo { height: 42px; width: auto; object-fit: contain; display: block; }
    .titulos h1 { margin: 0; font-weight: 800; font-size: 20px; color: #ffffff; }
    .titulos p { margin: 4px 0 0; font-size: 13px; color: #93c5fd; }

    .head-right { display: flex; align-items: center; gap: 18px; }
    .clock { text-align: right; color: #93c5fd; font-size: 12px; display: flex; flex-direction: column; align-items: flex-end; }
    .clock b { color: #ffffff; font-family: 'IBM Plex Mono'; font-size: 13px; }
    .pulse-live { width: 8px; height: 8px; border-radius: 50%; background: var(--cl-verde); display: inline-block; margin-right: 6px; box-shadow: 0 0 10px var(--cl-verde); }

    .controls-glass {
      display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-top: 18px;
      padding: 18px 22px; background: #ffffff; border-radius: 20px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05); border: 1px solid var(--line); position: relative; z-index: 500;
    }

    .controls-glass-sla {
      display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-top: 10px; margin-bottom: 14px;
      padding: 14px 18px; background: #f0f9ff; border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0, 130, 200, 0.06); border: 1px solid #bae6fd; position: relative; z-index: 490;
    }

    .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 130px; position: relative; }
    .field.search-field { flex: 2; min-width: 210px; }
    .field label { font-size: 11px; font-weight: 800; color: var(--cl-azul-dark); text-transform: uppercase; letter-spacing: 0.5px; }

    .date-input, .field input[type="text"] {
      width: 100%; height: 40px; border: 1px solid var(--line); background: #f8fafc; border-radius: 12px;
      padding: 0 12px; font-family: inherit; font-size: 13px; color: var(--ink); outline: none;
    }

    .combo-wrap { position: relative; width: 100%; z-index: 501; }
    .combo-input {
      width: 100%; height: 40px; border: 1px solid var(--line); background: #f8fafc; border-radius: 12px;
      padding: 0 28px 0 12px; font-family: inherit; font-size: 12.5px; color: var(--ink); cursor: pointer; text-overflow: ellipsis; outline: none; font-weight: 600;
    }
    .combo-arrow { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); pointer-events: none; }
    .combo-panel {
      position: absolute; left: 0; right: 0; top: 46px; background: #ffffff; border: 1px solid var(--line);
      border-radius: 16px; box-shadow: 0 15px 35px rgba(15, 23, 42, 0.15); z-index: 9999 !important; display: none; padding: 10px; min-width: 250px;
    }
    .combo-panel.show { display: block; }
    .combo-search { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; margin-bottom: 8px; outline: none; background: #f8fafc; }
    .combo-actions { display: flex; gap: 6px; margin-bottom: 8px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
    .combo-actions button { flex: 1; border: none; background: #f1f5f9; color: var(--ink); font-size: 11px; font-weight: 700; padding: 5px; border-radius: 6px; cursor: pointer; }
    .combo-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
    .combo-item-multi { display: flex; align-items: center; gap: 10px; padding: 7px 10px; font-size: 12.5px; border-radius: 8px; cursor: pointer; }
    .combo-item-multi:hover { background: var(--cl-verde-light); color: var(--cl-verde-hover); }

    .btn-clear {
      border: 1px solid var(--line); background: #f1f5f9; color: var(--ink); font-size: 12.5px; font-weight: 700;
      padding: 8px 14px; border-radius: 12px; cursor: pointer; height: 40px; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-clear:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }

    .controls-glass .sep { flex: 1; }
    .chip-group { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .vista-chip { font-size: 13px; font-weight: 800; color: var(--cl-azul); background: var(--cl-azul-light); border: 1px solid #bae6fd; padding: 6px 14px; border-radius: 999px; }
    .vista-subchip { font-size: 11.5px; color: var(--muted); font-weight: 600; }

    .nav-container { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
    .main-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .main-tab-btn {
      appearance: none; border: 2px solid var(--line); background: #ffffff;
      border-radius: 18px; padding: 16px 24px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      transition: all .2s var(--ease); box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
    }
    .main-tab-btn:hover { border-color: var(--cl-azul); transform: translateY(-2px); }
    .main-tab-btn.active {
      background: linear-gradient(135deg, #0a3356 0%, #0082c8 100%);
      border-color: #0082c8; color: #ffffff; box-shadow: 0 8px 24px rgba(0, 130, 200, 0.25);
    }
    .main-tab-info { display: flex; align-items: center; gap: 14px; }
    .main-tab-icon { font-size: 26px; }
    .main-tab-text { display: flex; flex-direction: column; text-align: left; }
    .main-tab-title { font-weight: 800; font-size: 16px; letter-spacing: -0.2px; }
    .main-tab-btn.active .main-tab-title { color: #ffffff; }
    .main-tab-sub { font-size: 12px; color: var(--muted); font-weight: 600; }
    .main-tab-btn.active .main-tab-sub { color: #93c5fd; }
    .main-tab-badge { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 12px; padding: 4px 12px; border-radius: 999px; background: #f1f5f9; color: var(--ink); }
    .main-tab-btn.active .main-tab-badge { background: rgba(255,255,255,0.2); color: #ffffff; }

    .sub-dock-wrap {
      background: #ffffff; border-radius: 16px; padding: 6px;
      border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(15, 23, 42, 0.03);
      display: flex; gap: 6px; overflow-x: auto;
    }
    .sub-dock-item {
      flex: 1; border: none; background: transparent; padding: 10px 14px;
      border-radius: 12px; font-family: inherit; font-size: 12.5px; font-weight: 700;
      color: var(--muted); cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 8px; white-space: nowrap; transition: all .15s ease;
    }
    .sub-dock-item:hover { background: #f1f5f9; color: var(--ink); }
    .sub-dock-item.active { background: var(--cl-verde-light); color: var(--cl-verde-hover); font-weight: 800; }

    .chart-controls-right { display: flex; align-items: center; gap: 6px; }
    .chart-toggle-group { display: flex; background: #f1f5f9; padding: 3px; border-radius: 10px; gap: 2px; }
    .btn-toggle-chart {
      border: none; background: transparent; font-size: 11px; font-weight: 800;
      color: var(--muted); padding: 4px 10px; border-radius: 8px; cursor: pointer; transition: all .15s ease;
    }
    .btn-toggle-chart:hover { color: var(--cl-azul); }
    .btn-toggle-chart.active { background: var(--cl-azul); color: #ffffff; box-shadow: 0 2px 6px rgba(0, 130, 200, 0.3); }

    .btn-expand-chart {
      border: 1px solid var(--line); background: #ffffff; color: var(--cl-azul-dark);
      font-size: 13px; font-weight: 800; padding: 4px 8px; border-radius: 8px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; transition: all .15s ease;
    }
    .btn-expand-chart:hover { background: var(--cl-azul-light); border-color: #bae6fd; color: var(--cl-azul); }

    .acciones-summary-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-top: 18px; }
    .card-accion-kpi {
      background: #ffffff; border-radius: 16px; padding: 14px 18px; border: 1px solid var(--line);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03); display: flex; flex-direction: column; gap: 4px;
      cursor: pointer; position: relative; overflow: hidden;
    }
    .card-accion-kpi:hover { transform: translateY(-2px); border-color: var(--cl-azul); }
    .card-accion-kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent-color, var(--cl-azul)); }
    .card-accion-title { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; }
    .card-accion-val { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 26px; color: var(--ink); line-height: 1.1; margin-top: 2px; }
    .card-accion-sub { font-size: 11px; color: var(--muted); font-weight: 600; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 12px; align-items: start; }
    .col { display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: #ffffff; border-radius: 20px; padding: 20px; box-shadow: 0 6px 18px rgba(15, 23, 42, 0.04);
      border: 1px solid var(--line); position: relative; overflow: hidden;
    }
    .card:hover { transform: translateY(-3px); border-color: rgba(0,130,200,0.3); }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-title { font-weight: 800; font-size: 14px; color: var(--cl-azul-dark); }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.verde { background: var(--cl-verde); } .dot.amarillo { background: var(--amarillo-warn); }
    .dot.rojo { background: var(--rojo-crit); } .dot.neu { background: var(--cl-azul); }

    .card-body { margin-top: 12px; display: flex; align-items: baseline; gap: 8px; }
    .big { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 40px; color: var(--ink); line-height: 1; }
    .u { font-size: 14px; color: var(--muted); font-weight: 700; }
    .card-foot { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); }

    .chart-container { margin-top: 10px; min-height: 250px; }
    .clickable { cursor: pointer; }

    .modal {
      position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center;
      background: rgba(10, 51, 86, 0.7); padding: 20px; opacity: 0; pointer-events: none; transition: opacity .2s ease;
    }
    .modal.show { opacity: 1; pointer-events: auto; }
    .modal-card { background: #f8fafc; border-radius: 24px; max-width: 1150px; width: 100%; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; transition: all .25s ease; }
    .modal-head { padding: 20px 28px; background: var(--cl-azul-dark); display: flex; justify-content: space-between; align-items: center; color: #fff; }
    .modal-head h3 { margin: 0; font-size: 16.5px; font-weight: 800; color: #ffffff; }
    .btn-close { border: none; background: rgba(255,255,255,0.15); border-radius: 50%; width: 36px; height: 36px; font-size: 20px; cursor: pointer; color: #fff; display: grid; place-items: center; }
    .modal-body { padding: 20px; overflow-y: auto; max-height: 75vh; }

    .consolidado-container { display: flex; flex-direction: column; gap: 14px; }
    .pedido-card { background: #ffffff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .pedido-head { background: #f1f5f9; padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .badge-pedido { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 13px; color: var(--cl-azul); background: var(--cl-azul-light); padding: 4px 10px; border-radius: 8px; }
    .pedido-cliente { font-weight: 800; font-size: 13.5px; color: var(--cl-azul-dark); }
    .tag-dias { font-family: 'IBM Plex Mono'; font-weight: 700; padding: 4px 10px; border-radius: 20px; font-size: 11px; text-align: center; }
    .tag-dias.ok { background: #dcfce7; color: #15803d; } 
    .tag-dias.crit { background: #fee2e2; color: #b91c1c; }

    .vacio { padding: 60px; text-align: center; color: var(--muted); font-size: 14px; font-weight: 600; }

    #loader {
      position: fixed; inset: 0; background: rgba(10, 51, 86, 0.55); display: flex;
      align-items: center; justify-content: center; z-index: 20000; opacity: 0; pointer-events: none; transition: opacity .15s ease;
    }
    #loader.show { opacity: 1; pointer-events: auto; }
    .spin { width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--cl-verde); animation: sp .8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }

    @media (max-width: 1200px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="no-scroll">

  <!-- SIGN IN -->
  <div id="signinOverlay" class="signin-overlay">
    <div class="signin-card" id="signinCard">
      <div class="signin-header">
        <div class="signin-logo">
          <img src="https://lh3.googleusercontent.com/d/1Oad9PEeniRz-nGI6idxfZr7BCBJzKD8C" alt="Logo Casalimpia" style="height:32px;">
        </div>
        <h2 class="signin-title">Iniciar Sesión</h2>
        <p class="signin-sub">Ingrese credenciales autorizadas del Google Sheet</p>
      </div>

      <form class="signin-form" onsubmit="event.preventDefault(); ejecutarLogin();">
        <div class="input-group">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          <input type="text" id="loginUser" class="input-field" placeholder="Usuario o Correo" required>
        </div>

        <div class="input-group">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <input type="password" id="loginPass" class="input-field" placeholder="Contraseña" required>
          <span class="toggle-pass" onclick="toggleVisibilidadPassword()">👁️</span>
        </div>

        <div id="loginError" class="error-msg"></div>

        <button type="submit" class="btn-signin" id="btnSubmitLogin">
          <span>Ingresar al Portal</span> ➔
        </button>
      </form>
    </div>
  </div>

  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo-header-wrap">
          <img src="https://lh3.googleusercontent.com/d/1Oad9PEeniRz-nGI6idxfZr7BCBJzKD8C" alt="Logo Casalimpia" class="header-logo">
        </div>
        <div class="titulos">
          <h1>Portal Operativo Casalimpia S.A.</h1>
          <p>Control Operativo</p>
        </div>
      </div>
      <div class="head-right">
        <div class="user-pill" id="userContainer" style="display:none;">
          <span id="userNameLabel">👤 Usuario</span>
          <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
        <div class="clock">
          <span class="pulse-live"></span> Datos en vivo
          <b id="actualizado">—</b>
        </div>
        <button class="btn-refresh" id="btnRefresh" onclick="cargarDatos(true)"><span class="ico">🔄</span> Actualizar</button>
      </div>
    </header>

    <div class="controls-glass">
      <div class="field"><label>Año</label><div id="comboAno"></div></div>
      <div class="field"><label>Periodo (Mes/Año)</label><div id="comboPeriodo"></div></div>
      <div class="field"><label>Fecha exacta (Día)</label><input type="date" id="inputFechaDia" class="date-input"></div>
      
      <div class="field filter-bq"><label>Cliente</label><div id="comboCliente"></div></div>
      <div class="field filter-bq"><label>Ciudad</label><div id="comboCiudad"></div></div>
      <div class="field filter-bq"><label>Estado</label><div id="comboEstado"></div></div>
      <div class="field filter-bq"><label>Estado Entrega</label><div id="comboEstadoEntrega"></div></div>
      <div class="field filter-bq"><label>Acción</label><div id="comboAccion"></div></div>
      
      <div class="field search-field"><label>Búsqueda rápida</label><input type="text" id="inputBusqueda" placeholder="🔍 Pedido, Activo, Maquinaria, Cliente..."></div>

        🎯 Filtros Independientes Módulo Seguimiento Pedidos (BigQuery)
      </div>
      <div class="field"><label>Cliente SLA</label><div id="comboClienteSLA"></div></div>
      <div class="field"><label>Ciudad SLA</label><div id="comboCiudadSLA"></div></div>
      <div class="field"><label>Estado WMS</label><div id="comboEstadoWmsSLA"></div></div>
      <div class="field"><label>Nivel de Alerta SLA</label><div id="comboAlertaSLA"></div></div>
      <div class="field"><label>Flag Agotado</label><div id="comboAgotadoSLA"></div></div>
      <button class="btn-clear" onclick="limpiarFiltrosSLA()">🧹 Limpiar SLA</button>
    </div>

    <div class="nav-container">
      <div class="main-tabs">
        <button class="main-tab-btn active" id="btnMainMaquinaria" onclick="cambiarVistaPrincipal('maquinaria')">
          <div class="main-tab-info">
            <span class="main-tab-icon">🚜</span>
            <div class="main-tab-text">
              <span class="main-tab-title">Maquinaria y Equipos</span>
              <span class="main-tab-sub">Vista 360°, Mantenimiento, Entregas y Agendador</span>
            </div>
          </div>
          <span class="main-tab-badge" id="badgeMaquinaria">0 registros</span>
        </button>

        <button class="main-tab-btn" id="btnMainPedidos" onclick="cambiarVistaPrincipal('pedidos')">
          <div class="main-tab-info">
            <span class="main-tab-icon">📦</span>
            <div class="main-tab-text">
              <span class="main-tab-title">Seguimiento Pedidos</span>
              <span class="main-tab-sub">Control de Tiempos y Alertas de Incumplimiento SLA</span>
            </div>
          </div>
          <span class="main-tab-badge" id="badgePedidos">0 pedidos</span>
        </button>
      </div>

      <!-- DOCK MAQUINARIA -->
      <div class="sub-dock-wrap" id="subDockMaquinaria">
        <button class="sub-dock-item active" onclick="cambiarSubModulo('general')">🧭 Vista 360°</button>
        <button class="sub-dock-item" onclick="cambiarSubModulo('mantenimiento')">🛠️ Mantenimiento Correctivo</button>
        <button class="sub-dock-item" onclick="cambiarSubModulo('entregas')">🚚 Entregas / Iniciaciones</button>
        <button class="sub-dock-item" onclick="cambiarSubModulo('recogidas')">🏁 Recogidas y Cierres</button>
        <button class="sub-dock-item" onclick="cambiarSubModulo('accesorios')">🧩 Accesorios y Adicionales</button>
      </div>

      <!-- DOCK SUBMÓDULOS PEDIDOS (CLASIFICADOR1) -->
      <div class="sub-dock-wrap" id="subDockPedidos" style="display: none;">
        <button class="sub-dock-item active" onclick="cambiarSubModuloSLA('todos')">🌐 Todos los Pedidos</button>
        <button class="sub-dock-item" onclick="cambiarSubModuloSLA('permanentes')">🏢 Permanentes (0)</button>
        <button class="sub-dock-item" onclick="cambiarSubModuloSLA('cobrables')">💵 Cobrables (1)</button>
        <button class="sub-dock-item" onclick="cambiarSubModuloSLA('ecommerce')">🛒 Ecommerce</button>
        <button class="sub-dock-item" onclick="cambiarSubModuloSLA('especiales')">⭐ Especiales (6 y 7)</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <div id="loader"><div class="spin"></div></div>

  <div id="modal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modalTitulo">Detalle Consolidado de Solicitudes</h3>
        <button class="btn-close" onclick="cerrarModal()">&times;</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
    let ESTADO = {
      anoSel: [], periodoSel: [], fechaDiaSel: '', clienteSel: [], ciudadSel: [], estadoSel: [],
      estadoEntregaSel: [], accionSel: [], busqueda: '', 
      vistaPrincipal: 'maquinaria',
      moduloSel: 'general',
      submoduloSLA: 'todos',
      eventos: [], eventosSLA: [], filtros: {}, filtrosSLA: {}, actualizado: ''
    };

    let ESTADO_SLA = { clienteSel: [], ciudadSel: [], estadoWmsSel: [], alertaSel: [], agotadoSel: [] };
    let CHART_INSTANCES = {};

    function toggleVisibilidadPassword() {
      const input = document.getElementById('loginPass');
      if (input) input.type = input.type === 'password' ? 'text' : 'password';
    }

    async function ejecutarLogin() {
      const user = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPass').value;
      const errBox = document.getElementById('loginError');
      const btn = document.getElementById('btnSubmitLogin');

      errBox.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = 'Validando credenciales...';

      try {
        const urlLogin = `${API_URL_AUTH}?accion=login&usuario=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`;
        const data = await cargarJsonp(urlLogin);

        if (data && data.exito) {
          localStorage.setItem('cmi_usuario_logueado', JSON.stringify(data));
          desbloquearPortal(data);
        } else {
          errBox.textContent = (data && data.mensaje) ? data.mensaje : 'Credenciales inválidas.';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.textContent = 'Error de conexión con el servidor.';
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Ingresar al Portal</span> ➔';
      }
    }

    function desbloquearPortal(userData) {
      document.getElementById('signinOverlay').classList.add('hidden');
      document.body.classList.remove('no-scroll');
      document.getElementById('userContainer').style.display = 'flex';
      document.getElementById('userNameLabel').textContent = '👤 ' + (userData.nombre || userData.usuario);
      cargarDatos(true);
    }

    function cerrarSesion() {
      localStorage.removeItem('cmi_usuario_logueado');
      location.reload();
    }

    function verificarSesionGuardada() {
      const sesion = localStorage.getItem('cmi_usuario_logueado');
      if (sesion) {
        try { desbloquearPortal(JSON.parse(sesion)); return true; } catch(e) {}
      }
      return false;
    }

    function loader(show) { document.getElementById('loader').classList.toggle('show', !!show); }

    function cargarJsonp(url, timeoutMs = 25000) {
      return new Promise((resolve) => {
        const callbackName = 'gvizCallback_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
        const script = document.createElement('script');
        let finalizado = false;

        const limpiar = () => {
          finalizado = true;
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        };

        setTimeout(() => { if (!finalizado) { limpiar(); resolve(null); } }, timeoutMs);

        window[callbackName] = (json) => {
          if (!finalizado) { limpiar(); resolve(json); }
        };

        const separador = url.indexOf('?') >= 0 ? '&' : '?';
        script.src = url + separador + 'callback=' + callbackName;
        document.body.appendChild(script);
      });
    }

    async function cargarDatos(forzarSinCache) {
      loader(true);
      try {
        const timestamp = Date.now();
        
        // Carga JSONP directa para evitar bloqueos CORS
        const urlSLA = `${API_URL_PEDIDOS}?modulo=sla&_nc=${timestamp}`;
        const rawSLA = await cargarJsonp(urlSLA);

        let dataSLA = { eventosSLA: [], filtrosSLA: {} };
        if (rawSLA && Array.isArray(rawSLA)) dataSLA = procesarDatosSLA(rawSLA);

        const urlGeneral = `${API_URL_MAQUINARIA}?modulo=general&_nc=${timestamp}`;
        const rawBQ = await cargarJsonp(urlGeneral);

        let dataBQ = { eventos: [], filtros: {} };
        if (rawBQ && Array.isArray(rawBQ)) dataBQ = procesarDatosBigQuery(rawBQ);

        inicializar(dataBQ, dataSLA);

      } catch (e) {
        console.error("Error general en la carga de datos:", e);
      } finally {
        loader(false);
      }
    }

    function procesarDatosBigQuery(eventosRaw) {
      const eventos = (Array.isArray(eventosRaw) ? eventosRaw : []).map(e => ({
        pedido: String(e.pedido || e.salida || ''),
        cliente: String(e.cliente || e.nombre || 'Sin cliente'),
        ciudad: String(e.ciudad || e.nombre_punto_destino || 'Sin ciudad'),
        fechaSolicitud: String(e.fechaSolicitud || e.fecha || ''),
        periodo: String(e.periodo || 'Sin fecha'),
        ano: String(e.ano || 'Sin fecha'),
        diasProceso: Number(e.diasProceso) || 0,
        estado: String(e.estado || 'Sin estado'),
        accion: String(e.accion || 'Mantenimiento'),
        maquinaria: String(e.maquinaria || 'Sin especificar'),
        codActivo: String(e.codActivo || ''),
        observacionDetalle: String(e.observacionDetalle || ''),
        esFallaCritica: Boolean(e.esFallaCritica),
        estadoEntrega: String(e.estadoEntrega || 'Sin estado entrega')
      }));

      function unicos(campo) {
        const vistos = {};
        eventos.forEach(e => { if (e[campo]) vistos[e[campo]] = true; });
        return Object.keys(vistos).sort((a, b) => b.localeCompare(a, 'es'));
      }

      return {
        eventos,
        filtros: { 
          anos: unicos('ano'), clientes: unicos('cliente'), ciudades: unicos('ciudad'), 
          acciones: unicos('accion'), estados: unicos('estado'), estadosEntrega: unicos('estadoEntrega'), periodos: unicos('periodo') 
        }
      };
    }

    function procesarDatosSLA(rawSLA) {
      const eventosSLA = (Array.isArray(rawSLA) ? rawSLA : []).map(e => {
        const clasif1 = (e.clasificador1 !== undefined && e.clasificador1 !== null && String(e.clasificador1).trim() !== '') 
          ? String(e.clasificador1).trim() 
          : '0';

        let submod = 'permanentes';
        if (clasif1 === '1') submod = 'cobrables';
        else if (clasif1.toUpperCase() === 'ECOMMERCE') submod = 'ecommerce';
        else if (clasif1 === '6' || clasif1 === '7') submod = 'especiales';

        return {
          pedido: String(e.pedido || ''),
          cliente: String(e.cliente || 'Sin cliente'),
          ciudad: String(e.ciudad || 'Sin ciudad'),
          estadoWMS: String(e.estadoWMS || 'Sin Estado'),
          clasificador1: clasif1,
          submoduloSLA: submod,
          flagAgotado: String(e.flagAgotado || 'NO'),
          fechaMontaje: String(e.fechaMontaje || 'Sin fecha'),
          ano: String(e.ano || 'Sin fecha'),
          periodo: String(e.periodo || 'Sin fecha'),
          diasTranscurridos: Number(e.diasTranscurridos) || 0,
          alertaSLA: String(e.alertaSLA || 'DENTRO_SLA'),
          totalItems: Number(e.totalItems) || 1,
          detalleProductos: String(e.detalleProductos || 'Sin detalle')
        };
      });

      function unicosSLA(campo) {
        const vistos = {};
        eventosSLA.forEach(e => { if (e[campo]) vistos[e[campo]] = true; });
        return Object.keys(vistos).sort((a, b) => a.localeCompare(b, 'es'));
      }

      return {
        eventosSLA,
        filtrosSLA: {
          clientes: unicosSLA('cliente'),
          ciudades: unicosSLA('ciudad'),
          estadosWms: unicosSLA('estadoWMS'),
          alertas: unicosSLA('alertaSLA'),
          agotados: unicosSLA('flagAgotado')
        }
      };
    }

    function inicializar(dataBQ, dataSLA) {
      ESTADO.eventos = dataBQ.eventos || [];
      ESTADO.filtros = dataBQ.filtros || {};
      ESTADO.eventosSLA = dataSLA.eventosSLA || [];
      ESTADO.filtrosSLA = dataSLA.filtrosSLA || {};
      
      ESTADO.actualizado = new Date().toLocaleString('es-CO', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit', hour12: true });
      document.getElementById('actualizado').textContent = ESTADO.actualizado;
      
      document.getElementById('badgeMaquinaria').textContent = contarPedidosUnicos(ESTADO.eventos) + " registros";
      document.getElementById('badgePedidos').textContent = contarPedidosUnicos(ESTADO.eventosSLA) + " pedidos";

      poblarCombos();
      poblarCombosSLA();
      render();
    }

    function cambiarVistaPrincipal(vista) {
      ESTADO.vistaPrincipal = vista;
      
      const btnMaq = document.getElementById('btnMainMaquinaria');
      const btnPed = document.getElementById('btnMainPedidos');
      const subDockMaq = document.getElementById('subDockMaquinaria');
      const subDockPed = document.getElementById('subDockPedidos');
      const barFiltrosSLA = document.getElementById('barFiltrosSLA');

      if (vista === 'maquinaria') {
        btnMaq.classList.add('active');
        btnPed.classList.remove('active');
        subDockMaq.style.display = 'flex';
        subDockPed.style.display = 'none';
        barFiltrosSLA.style.display = 'none';
        document.querySelectorAll('.filter-bq').forEach(el => el.style.display = 'flex');
      } else {
        btnPed.classList.add('active');
        btnMaq.classList.remove('active');
        subDockMaq.style.display = 'none';
        subDockPed.style.display = 'flex';
        barFiltrosSLA.style.display = 'flex';
        document.querySelectorAll('.filter-bq').forEach(el => el.style.display = 'none');
      }

      render();
    }

    function cambiarSubModulo(subKey) {
      ESTADO.moduloSel = subKey;
      document.querySelectorAll('#subDockMaquinaria .sub-dock-item').forEach(btn => {
        btn.classList.remove('active');
        if (btn.getAttribute('onclick').includes(`'${subKey}'`)) btn.classList.add('active');
      });
      render();
    }

    function cambiarSubModuloSLA(subKey) {
      ESTADO.submoduloSLA = subKey;
      document.querySelectorAll('#subDockPedidos .sub-dock-item').forEach(btn => {
        btn.classList.remove('active');
        if (btn.getAttribute('onclick').includes(`'${subKey}'`)) btn.classList.add('active');
      });
      render();
    }

    function poblarCombos() {
      crearComboMultiples('comboAno', ESTADO.filtros.anos, ESTADO.anoSel, v => { ESTADO.anoSel = v; render(); }, 'Todos los años');
      crearComboMultiples('comboPeriodo', ESTADO.filtros.periodos, ESTADO.periodoSel, v => { ESTADO.periodoSel = v; render(); }, 'Todos los periodos');
      crearComboMultiples('comboCliente', ESTADO.filtros.clientes, ESTADO.clienteSel, v => { ESTADO.clienteSel = v; render(); }, 'Todos los clientes');
      crearComboMultiples('comboCiudad', ESTADO.filtros.ciudades, ESTADO.ciudadSel, v => { ESTADO.ciudadSel = v; render(); }, 'Todas las ciudades');
      crearComboMultiples('comboEstado', ESTADO.filtros.estados, ESTADO.estadoSel, v => { ESTADO.estadoSel = v; render(); }, 'Todos los estados');
      crearComboMultiples('comboEstadoEntrega', ESTADO.filtros.estadosEntrega, ESTADO.estadoEntregaSel, v => { ESTADO.estadoEntregaSel = v; render(); }, 'Todos los estados entrega');
      crearComboMultiples('comboAccion', ESTADO.filtros.acciones, ESTADO.accionSel, v => { ESTADO.accionSel = v; render(); }, 'Todas las acciones');
    }

    function poblarCombosSLA() {
      crearComboMultiples('comboClienteSLA', ESTADO.filtrosSLA.clientes || [], ESTADO_SLA.clienteSel, v => { ESTADO_SLA.clienteSel = v; render(); }, 'Todos los clientes SLA');
      crearComboMultiples('comboCiudadSLA', ESTADO.filtrosSLA.ciudades || [], ESTADO_SLA.ciudadSel, v => { ESTADO_SLA.ciudadSel = v; render(); }, 'Todas las ciudades SLA');
      crearComboMultiples('comboEstadoWmsSLA', ESTADO.filtrosSLA.estadosWms || [], ESTADO_SLA.estadoWmsSel, v => { ESTADO_SLA.estadoWmsSel = v; render(); }, 'Todos los estados WMS');
      crearComboMultiples('comboAlertaSLA', ESTADO.filtrosSLA.alertas || [], ESTADO_SLA.alertaSel, v => { ESTADO_SLA.alertaSel = v; render(); }, 'Todas las Alertas');
      crearComboMultiples('comboAgotadoSLA', ESTADO.filtrosSLA.agotados || [], ESTADO_SLA.agotadoSel, v => { ESTADO_SLA.agotadoSel = v; render(); }, 'Agotado (Sí/No)');
    }

    function crearComboMultiples(contenedorId, opciones, seleccionados, alCambiar, etiquetaTodos) {
      const container = document.getElementById(contenedorId);
      if (!container) return;
      const opcionesList = opciones || [];

      const obtenerTextoBoton = () => {
        if (!seleccionados || seleccionados.length === 0 || seleccionados.length === opcionesList.length) return etiquetaTodos;
        if (seleccionados.length === 1) return seleccionados[0];
        return seleccionados.length + ' seleccionados';
      };

      container.innerHTML = `
        <div class="combo-wrap">
          <input type="text" class="combo-input" value="${obtenerTextoBoton()}" readonly>
          <span class="combo-arrow">▾</span>
          <div class="combo-panel">
            <input type="text" class="combo-search" placeholder="🔍 Buscar...">
            <div class="combo-actions">
              <button type="button" class="btn-all">Todos</button>
              <button type="button" class="btn-none">Limpiar</button>
            </div>
            <div class="combo-list"></div>
          </div>
        </div>
      `;

      const wrap = container.querySelector('.combo-wrap');
      const input = container.querySelector('.combo-input');
      const panel = container.querySelector('.combo-panel');
      const search = container.querySelector('.combo-search');
      const list = container.querySelector('.combo-list');

      const renderizarLista = (filtro) => {
        const filtrados = opcionesList.filter(it => !filtro || it.toLowerCase().indexOf(filtro.toLowerCase()) >= 0);
        list.innerHTML = filtrados.map(it => {
          const isChecked = (seleccionados.length === 0 || seleccionados.indexOf(it) >= 0) ? 'checked' : '';
          return `<label class="combo-item-multi"><input type="checkbox" value="${it}" ${isChecked}><span>${it}</span></label>`;
        }).join('');
      };

      input.addEventListener('click', () => {
        document.querySelectorAll('.combo-panel.show').forEach(p => { if(p !== panel) p.classList.remove('show'); });
        panel.classList.toggle('show');
        if (panel.classList.contains('show')) { search.value = ''; renderizarLista(''); search.focus(); }
      });

      search.addEventListener('input', () => renderizarLista(search.value));

      list.addEventListener('change', (e) => {
        if (e.target.tagName === 'INPUT') {
          const val = e.target.value;
          if (e.target.checked) { if (seleccionados.indexOf(val) < 0) seleccionados.push(val); } 
          else { const idx = seleccionados.indexOf(val); if (idx >= 0) seleccionados.splice(idx, 1); }
          input.value = obtenerTextoBoton(); 
          alCambiar(seleccionados);
        }
      });

      container.querySelector('.btn-all').addEventListener('click', (e) => {
        e.stopPropagation(); seleccionados.length = 0; renderizarLista(search.value);
        input.value = obtenerTextoBoton(); alCambiar(seleccionados);
      });

      container.querySelector('.btn-none').addEventListener('click', (e) => {
        e.stopPropagation(); seleccionados.length = 0; seleccionados.push('__NINGUNO__');
        list.querySelectorAll('input').forEach(c => c.checked = false);
        input.value = '0 seleccionados'; alCambiar(seleccionados);
      });

      document.addEventListener('click', (e) => { if (!wrap.contains(e.target)) panel.classList.remove('show'); });
    }

    function limpiarFiltros() {
      ESTADO.anoSel = []; ESTADO.periodoSel = []; ESTADO.fechaDiaSel = ''; ESTADO.clienteSel = []; ESTADO.ciudadSel = [];
      ESTADO.estadoSel = []; ESTADO.estadoEntregaSel = []; ESTADO.accionSel = []; ESTADO.busqueda = '';
      poblarCombos(); limpiarFiltrosSLA(); render();
    }

    function limpiarFiltrosSLA() {
      ESTADO_SLA.clienteSel = []; ESTADO_SLA.ciudadSel = []; ESTADO_SLA.estadoWmsSel = []; ESTADO_SLA.alertaSel = []; ESTADO_SLA.agotadoSel = [];
      poblarCombosSLA(); render();
    }

    function filtrarEventosSLA() {
      return ESTADO.eventosSLA.filter(e => {
        if (ESTADO.submoduloSLA !== 'todos' && e.submoduloSLA !== ESTADO.submoduloSLA) return false;

        if (ESTADO.busqueda && ESTADO.busqueda.trim() !== '') {
          const qRaw = ESTADO.busqueda.trim().toLowerCase();
          const matchText = (e.pedido + ' ' + e.cliente + ' ' + e.ciudad + ' ' + e.clasificador1).toLowerCase();
          if (matchText.indexOf(qRaw) < 0) return false;
        }

        if (ESTADO_SLA.clienteSel.length > 0 && ESTADO_SLA.clienteSel.indexOf(e.cliente) < 0) return false;
        if (ESTADO_SLA.ciudadSel.length > 0 && ESTADO_SLA.ciudadSel.indexOf(e.ciudad) < 0) return false;
        if (ESTADO_SLA.estadoWmsSel.length > 0 && ESTADO_SLA.estadoWmsSel.indexOf(e.estadoWMS) < 0) return false;
        if (ESTADO_SLA.alertaSel.length > 0 && ESTADO_SLA.alertaSel.indexOf(e.alertaSLA) < 0) return false;

        return true;
      });
    }

    function contarPedidosUnicos(evs) {
      const vistos = {}; evs.forEach(e => { if (e.pedido) vistos[e.pedido] = true; });
      return Object.keys(vistos).length;
    }

    function render() {
      Object.keys(CHART_INSTANCES).forEach(k => { if (CHART_INSTANCES[k]) CHART_INSTANCES[k].destroy(); });
      CHART_INSTANCES = {};

      const esSLA = (ESTADO.vistaPrincipal === 'pedidos');
      const evs = esSLA ? filtrarEventosSLA() : ESTADO.eventos;

      document.getElementById('chipPedidos').textContent = contarPedidosUnicos(evs) + ' Pedidos Únicos';
      document.getElementById('chipItems').textContent = '(' + evs.length + ' ítems)';

      const grid = document.getElementById('grid');
      if (!evs.length) { grid.innerHTML = '<div class="vacio">No hay solicitudes que coincidan con los filtros aplicados.</div>'; return; }

      if (esSLA) grid.innerHTML = renderVistaAlertasSLA(evs);
      else grid.innerHTML = renderVistaMaquinaria(evs);
    }

    function renderVistaMaquinaria(evs) {
      return `<div class="col">
        ${cardKPI('Total Pedidos Únicos', contarPedidosUnicos(evs), 'órdenes', 'verde', evs.length + ' ítems en total', 'general')}
      </div>
      <div class="col">
        ${cardChartBox('Mantenimientos por Cliente', 'chartMaquinariaClientes', 'cliente', '#0082c8')}
      </div>
      <div class="col">
        ${cardChartBox('Mantenimientos por Estado', 'chartMaquinariaEstados', 'estado', '#7ab833')}
      </div>`;
    }

    function renderVistaAlertasSLA(evsSLA) {
      const totalPedidos = contarPedidosUnicos(evsSLA);
      const fueraSLA = evsSLA.filter(e => e.alertaSLA === "FUERA_SLA");
      const dentroSLA = evsSLA.filter(e => e.alertaSLA === "DENTRO_SLA");

      const pctCumplimiento = totalPedidos > 0 ? Math.round(((totalPedidos - contarPedidosUnicos(fueraSLA)) / totalPedidos) * 100) : 100;

      return `<div class="col">
        ${cardKPI('Total Pedidos en Submódulo', totalPedidos, 'órdenes', 'neu', 'Base cargada desde BigQuery', 'slaAll')}
        ${cardKPI('Pedidos Fuera de SLA', contarPedidosUnicos(fueraSLA), 'órdenes', 'rojo', 'Incumplen el tiempo límite', 'slaFuera')}
        ${cardKPI('Pedidos Dentro de SLA', contarPedidosUnicos(dentroSLA), 'órdenes', 'verde', 'Atendidos en tiempo límite', 'slaDentro')}
        ${cardKPI('Cumplimiento Global', pctCumplimiento + '%', 'SLA', pctCumplimiento >= 90 ? 'verde' : 'rojo', 'Nivel de servicio alcanzado', 'slaPct')}
      </div>
      <div class="col">
        ${cardChartBox('Causas y Estados SLA', 'chartCausasSLA', 'alertaSLA', '#ef4444')}
      </div>
      <div class="col">
        ${cardChartBox('Distribución por Estado WMS', 'chartEstadoWmsSLA', 'estadoWMS', '#7ab833')}
      </div>`;
    }

    function cardKPI(titulo, valor, unidad, semaforo, sub, filtroTipo) {
      return `<div class="card clickable" onclick="abrirDetalleKpi('${titulo}', '${filtroTipo}')">
        <div class="card-top"><span class="card-title">${titulo}</span><span class="dot ${semaforo}"></span></div>
        <div class="card-body"><span class="big">${valor}</span><span class="u">${unidad}</span></div>
        <div class="card-foot">${sub}</div>
      </div>`;
    }

    function cardChartBox(titulo, chartId, campoFiltro, colorHex) {
      return `<div class="card">
        <div class="card-top"><span class="card-title">${titulo}</span></div>
        <div id="${chartId}" class="chart-container"></div>
      </div>`;
    }

    function abrirDetalleKpi(titulo, tipo) {
      let evs = filtrarEventosSLA();
      if (tipo === 'slaFuera') evs = evs.filter(e => e.alertaSLA === 'FUERA_SLA');
      else if (tipo === 'slaDentro') evs = evs.filter(e => e.alertaSLA === 'DENTRO_SLA');
      mostrarModalConsolidadoSLA(titulo, evs);
    }

    function mostrarModalConsolidadoSLA(titulo, eventosListSLA) {
      document.getElementById('modalTitulo').textContent = titulo + ' (' + eventosListSLA.length + ' Pedidos Únicos)';
      const body = document.getElementById('modalBody');

      if (!eventosListSLA.length) { body.innerHTML = '<div class="vacio">No hay registros para mostrar.</div>'; return; }

      body.innerHTML = '<div class="consolidado-container">' + eventosListSLA.map(e => `
        <div class="pedido-card">
          <div class="pedido-head">
            <span class="badge-pedido"># Pedido: ${e.pedido}</span>
            <span class="pedido-cliente">${e.cliente} (${e.ciudad})</span>
            <span class="tag-dias ${e.alertaSLA === 'FUERA_SLA' ? 'crit' : 'ok'}">${e.alertaSLA}</span>
          </div>
          <div class="pedido-body">
            <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; font-size: 12px;">
              <div>📅 <b>Fecha:</b> ${e.fechaMontaje}</div>
              <div>⏳ <b>Días:</b> ${e.diasTranscurridos}</div>
              <div>📦 <b>Estado:</b> ${e.estadoWMS}</div>
              <div>🏷️ <b>Clasificador:</b> ${e.clasificador1}</div>
            </div>
            <div style="margin-top:8px; font-size:11.5px; color:var(--muted); background:#f8fafc; padding:8px; border-radius:8px;">
              <b>Ítems:</b> ${e.detalleProductos}
            </div>
          </div>
        </div>
      `).join('') + '</div>';

      document.getElementById('modal').classList.add('show');
    }

    function cerrarModal() { document.getElementById('modal').classList.remove('show'); }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('inputBusqueda').addEventListener('input', (e) => { ESTADO.busqueda = e.target.value; render(); });
      document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') cerrarModal(); });
      if (!verificarSesionGuardada()) loader(false);
    });
  </script>
</body>
</html>
